name: Explorer Seed Rolling Update

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
      - security/explorer-seed-rollout-script-tdd
    paths:
      - '.github/workflows/explorer-seed-rolling-update.yml'
      - 'deployment/testnet/explorer-seed-rollout-trigger.txt'
      - 'deployment/testnet/rollout-explorer-node.sh'
      - 'deployment/testnet/rollout-explorer-node_test.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollout:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/public-testnet-wallet-v2' && github.event.head_commit.message == 'ops(testnet): execute explorer seed rolling update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      SOURCE_SHA: 2a88966941b214032ff176302ea46a9d01e96e48
      OLD_BINARY_SHA: a0cc493b1d0237245ec1528ab8a0d13682719aa32f60afa4f6818da9e9661b63
      SEED_1_PRIVATE_IP: 172.31.10.171
      SEED_2_PRIVATE_IP: 172.31.32.195
      PUBLIC_RPC_BASE: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
    steps:
      - name: Checkout rollout operations files
        uses: actions/checkout@v4
        with:
          path: ops
          fetch-depth: 1

      - name: Verify explicit execution marker and rollout safety contract
        working-directory: ops
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat deployment/testnet/explorer-seed-rollout-trigger.txt)" = "EXECUTE_SOURCE_SHA=$SOURCE_SHA"
          bash deployment/testnet/rollout-explorer-node_test.sh

      - name: Confirm pinned source CI is green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=100")"
          printf '%s' "$runs" | jq -e '.workflow_runs[] | select(.name == "CI" and .conclusion == "success")' >/dev/null
          echo "Pinned source has a successful full CI run: $SOURCE_SHA"

      - name: Checkout pinned green source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: src
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Verify explorer and consensus safety gates
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -q 'MaxSupplySUDH uint64 = 51_000_000_000' params/params.go
          grep -q 'InitialBlockRewardSUDH uint64 = 50' params/params.go
          grep -q 'HalvingInterval uint64 = 1_000_000' params/params.go
          grep -q 'mux.HandleFunc("/v1/explorer/status"' rpc/server.go
          grep -q 'crypto/sha256' pow/pow.go

          deps="$(go list -deps ./cmd/sudharma-rpcd)"
          if printf '%s\n' "$deps" | grep -Eiq '/(gpu|cuda|opencl|khushi)(/|$)'; then
            echo 'Refusing rollout: prohibited accelerator dependency reached sudharma-rpcd.' >&2
            exit 1
          fi
          echo 'Accelerator consensus dependency gate: disabled/not linked into sudharma-rpcd'
          go test ./blockchain ./consensus ./params ./pow ./rpc -count=1

      - name: Build pinned node rollout bundle
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rollout-bundle"
          cd src
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/rollout-bundle/sudharma-rpcd" ./cmd/sudharma-rpcd
          cd "$GITHUB_WORKSPACE"
          cp ops/deployment/testnet/rollout-explorer-node.sh "$RUNNER_TEMP/rollout-bundle/rollout-explorer-node.sh"
          chmod 0755 "$RUNNER_TEMP/rollout-bundle/rollout-explorer-node.sh"
          binary_sha="$(sha256sum "$RUNNER_TEMP/rollout-bundle/sudharma-rpcd" | awk '{print $1}')"
          test -n "$binary_sha"
          echo "binary_sha=$binary_sha" >> "$GITHUB_OUTPUT"
          echo "Built pinned explorer-capable node binary: $binary_sha"

      - name: Upload one-day rollout artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-explorer-node-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/rollout-bundle/*
          retention-days: 1
          if-no-files-found: error

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Roll Seed-1 then Seed-2 with per-seed rollback
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          NEW_BINARY_SHA: ${{ steps.build.outputs.binary_sha }}
        shell: bash
        run: |
          set -euo pipefail

          get_instance_id() {
            local private_ip="$1"
            aws ssm describe-instance-information \
              --query "InstanceInformationList[?IPAddress=='${private_ip}' && PingStatus=='Online'] | [0].InstanceId" \
              --output text
          }

          get_signed_artifact_url() {
            local api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
            local url=''
            for _ in $(seq 1 10); do
              url="$(curl -sS -o /dev/null -w '%{redirect_url}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$api" || true)"
              if [ -n "$url" ]; then
                printf '%s' "$url"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_command() {
            local command_id="$1"
            local instance_id="$2"
            local status=''
            for _ in $(seq 1 150); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query Status \
                --output text 2>/dev/null || true)"
              case "$status" in
                Success) return 0 ;;
                Failed|Cancelled|TimedOut|Cancelling) return 1 ;;
              esac
              sleep 2
            done
            return 1
          }

          deploy_seed() {
            local label="$1"
            local private_ip="$2"
            local expected_node="$3"
            local instance_id
            local download_url
            local url_b64
            local bootstrap
            local parameters
            local command_id
            local result

            instance_id="$(get_instance_id "$private_ip")"
            if [ -z "$instance_id" ] || [ "$instance_id" = 'None' ]; then
              echo "$label: no Online SSM managed instance found" >&2
              return 1
            fi
            echo "::add-mask::$instance_id"

            download_url="$(get_signed_artifact_url)"
            if [ -z "$download_url" ]; then
              echo "$label: failed to obtain short-lived artifact URL" >&2
              return 1
            fi
            url_b64="$(printf '%s' "$download_url" | base64 -w0)"

            bootstrap="$(printf '%s\n' \
              'set -eu' \
              'tmp=$(mktemp -d /tmp/sudharma-explorer-bootstrap.XXXXXX)' \
              'trap '\''rm -rf "$tmp"'\'' EXIT INT TERM' \
              "url=\$(printf '%s' '$url_b64' | base64 -d)" \
              'curl -fL --retry 3 --connect-timeout 10 --max-time 120 -o "$tmp/artifact.zip" "$url"' \
              'mkdir -p "$tmp/extracted"' \
              'python3 -m zipfile -e "$tmp/artifact.zip" "$tmp/extracted"' \
              'chmod 0700 "$tmp/extracted/rollout-explorer-node.sh"' \
              "EXPECTED_OLD_SHA='$OLD_BINARY_SHA' EXPECTED_NEW_SHA='$NEW_BINARY_SHA' EXPECTED_NODE_ID='$expected_node' PRIVATE_IP='$private_ip' CANDIDATE_PATH=\"\$tmp/extracted/sudharma-rpcd\" \"\$tmp/extracted/rollout-explorer-node.sh\"")"

            parameters="$(jq -cn --arg command "$bootstrap" '{commands:[$command]}')"
            command_id="$(aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name AWS-RunShellScript \
              --comment "Sudharma explorer rolling update: ${label}" \
              --timeout-seconds 600 \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text)"
            echo "::add-mask::$command_id"

            if ! wait_command "$command_id" "$instance_id"; then
              echo "$label: rollout command failed" >&2
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                --output json || true
              return 1
            fi

            result="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
              --output json)"
            echo "$label: $result"
            [ "$(printf '%s' "$result" | jq -r '.status')" = 'Success' ]
          }

          deploy_seed 'seed-1' "$SEED_1_PRIVATE_IP" 'testnet-seed-1'
          deploy_seed 'seed-2' "$SEED_2_PRIVATE_IP" 'testnet-seed-2'

          for attempt in $(seq 1 30); do
            if curl -fsS "$PUBLIC_RPC_BASE/v1/status" >/dev/null \
              && curl -fsS "$PUBLIC_RPC_BASE/v1/explorer/status" >/dev/null \
              && curl -fsS "$PUBLIC_RPC_BASE/v1/explorer/blocks?limit=5" >/dev/null \
              && curl -fsS "$PUBLIC_RPC_BASE/v1/explorer/transactions?limit=5" >/dev/null; then
              echo 'Both seeds and the public read-only explorer bridge are healthy.'
              exit 0
            fi
            sleep 2
          done
          echo 'Public explorer smoke checks did not become healthy.' >&2
          exit 1

      - name: Record rollout safety boundary
        if: always()
        shell: bash
        run: |
          echo "source_sha=$SOURCE_SHA"
          echo 'mainnet_activation=0'
          echo 'accelerator_consensus_deployment=0'
          echo 'raw_rpc_public_exposure=0'
          echo 'seed_config_changes=0'
          echo 'rolling_order=seed-1-then-seed-2'
