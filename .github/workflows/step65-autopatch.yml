name: Step 65 peer keepalive autopatch

on:
  push:
    branches:
      - feature/step65-peer-keepalive

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/step65-peer-keepalive
          fetch-depth: 0

      - name: Apply keepalive lifecycle patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          node = Path('p2p/node.go')
          text = node.read_text()
          old = '''func (n *Node) storePeer(peer *PeerConnection) bool {
          \tif peer == nil || peer.Info.NodeID == "" || peer.Info.NodeID == n.NodeID {
          \t\treturn false
          \t}

          \tn.mu.Lock()
          \tdefer n.mu.Unlock()
          \tif _, exists := n.peers[peer.Info.NodeID]; exists {
          \t\treturn false
          \t}
          \tif !n.canStorePeerLocked(peer) {
          \t\treturn false
          \t}
          \tn.peers[peer.Info.NodeID] = peer
          \treturn true
          }
          '''
          new = '''func (n *Node) storePeer(peer *PeerConnection) bool {
          \tif peer == nil || peer.Info.NodeID == "" || peer.Info.NodeID == n.NodeID {
          \t\treturn false
          \t}

          \tn.mu.Lock()
          \tif _, exists := n.peers[peer.Info.NodeID]; exists {
          \t\tn.mu.Unlock()
          \t\treturn false
          \t}
          \tif !n.canStorePeerLocked(peer) {
          \t\tn.mu.Unlock()
          \t\treturn false
          \t}
          \tn.peers[peer.Info.NodeID] = peer
          \tn.mu.Unlock()

          \t// Keep established peers active at the application-protocol level.
          \t// The read loop intentionally has an idle deadline, so without a
          \t// heartbeat two healthy but quiet nodes would disconnect.
          \tgo n.keepPeerAlive(peer)
          \treturn true
          }
          '''
          if old not in text:
              raise SystemExit('storePeer target block not found')
          node.write_text(text.replace(old, new, 1))

          Path('p2p/peer_keepalive.go').write_text(r'''package p2p

import (
    "sync/atomic"
    "time"
)

// PeerKeepaliveInterval is deliberately shorter than PeerReadIdleTimeout so
// quiet but healthy peers exchange application-level traffic before either
// read loop reaches its idle deadline.
const PeerKeepaliveInterval = PeerReadIdleTimeout / 3

var peerKeepaliveNonce atomic.Uint64

func (n *Node) keepPeerAlive(peer *PeerConnection) {
    n.keepPeerAliveWithInterval(peer, PeerKeepaliveInterval)
}

func (n *Node) keepPeerAliveWithInterval(peer *PeerConnection, interval time.Duration) {
    if n == nil || peer == nil || interval <= 0 {
        return
    }

    ticker := time.NewTicker(interval)
    defer ticker.Stop()

    for range ticker.C {
        if !n.isCurrentPeerConnection(peer) {
            return
        }

        ping, err := NewPingMessage(peerKeepaliveNonce.Add(1))
        if err != nil {
            return
        }
        if err := peer.write(ping); err != nil {
            n.removePeerConnection(peer)
            if peer.conn != nil {
                _ = peer.conn.Close()
            }
            return
        }
    }
}

func (n *Node) isCurrentPeerConnection(peer *PeerConnection) bool {
    if n == nil || peer == nil || peer.Info.NodeID == "" {
        return false
    }
    n.mu.RLock()
    defer n.mu.RUnlock()
    current, ok := n.peers[peer.Info.NodeID]
    return ok && current == peer
}
''')

          Path('p2p/peer_keepalive_test.go').write_text(r'''package p2p

import (
    "bufio"
    "net"
    "testing"
    "time"
)

func TestPeerKeepaliveSendsPingAndStopsWhenPeerRemoved(t *testing.T) {
    node, err := NewNode("local", "127.0.0.1:0", 0, "tip")
    if err != nil {
        t.Fatal(err)
    }

    local, remote := net.Pipe()
    defer local.Close()
    defer remote.Close()

    peer := &PeerConnection{
        Info:   PeerInfo{NodeID: "remote", ListenAddress: "127.0.0.1:1", TotalWork: "1"},
        conn:   local,
        reader: bufio.NewReader(local),
    }
    node.mu.Lock()
    node.peers[peer.Info.NodeID] = peer
    node.mu.Unlock()

    done := make(chan struct{})
    go func() {
        node.keepPeerAliveWithInterval(peer, 5*time.Millisecond)
        close(done)
    }()

    if err := remote.SetReadDeadline(time.Now().Add(time.Second)); err != nil {
        t.Fatal(err)
    }
    data, err := readBoundedPeerMessage(bufio.NewReader(remote))
    if err != nil {
        t.Fatalf("read keepalive ping: %v", err)
    }
    message, err := DecodeMessage(data)
    if err != nil {
        t.Fatal(err)
    }
    ping, err := DecodePing(message)
    if err != nil {
        t.Fatalf("keepalive was not a valid ping: %v", err)
    }
    if ping.Nonce == 0 {
        t.Fatal("keepalive ping nonce must be non-zero")
    }

    node.removePeerConnection(peer)
    select {
    case <-done:
    case <-time.After(250 * time.Millisecond):
        t.Fatal("keepalive loop did not stop after peer removal")
    }
}

func TestPeerKeepaliveIntervalPrecedesReadIdleTimeout(t *testing.T) {
    if PeerKeepaliveInterval <= 0 || PeerKeepaliveInterval >= PeerReadIdleTimeout {
        t.Fatalf("invalid keepalive interval %s for idle timeout %s", PeerKeepaliveInterval, PeerReadIdleTimeout)
    }
}
''')

          # This workflow is only a one-shot code-mod helper; remove it from the
          # resulting branch so it can never become part of the product.
          Path('.github/workflows/step65-autopatch.yml').unlink()
          PY

          gofmt -w p2p/node.go p2p/peer_keepalive.go p2p/peer_keepalive_test.go
          go test ./p2p -count=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep quiet P2P peers alive with protocol pings"
          git push origin HEAD:feature/step65-peer-keepalive
