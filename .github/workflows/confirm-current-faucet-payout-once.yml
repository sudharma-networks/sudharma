name: Confirm Current Faucet Payout Once

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/confirm-current-faucet-payout-once.yml'

permissions:
  contents: read

concurrency:
  group: sudharma-testnet-confirm-current-faucet-payout
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
      SEED: 3.7.253.229:28444
      REWARD_ADDRESS: 9ccdc094489874bed888ffe4bdf9b8298f4c5131
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify repository tests
        run: go test ./... -count=1

      - name: Build bounded native miner
        run: go build -trimpath -o "$RUNNER_TEMP/sudharmad" ./cmd/sudharmad

      - name: Require a pending transaction
        id: before
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -fsS --max-time 15 "$API/v1/status")"
          height="$(printf '%s' "$status" | jq -r '.height')"
          mempool="$(printf '%s' "$status" | jq -r '.mempool')"
          supply="$(printf '%s' "$status" | jq -r '.issued_supply')"
          printf 'Before mining: height=%s mempool=%s supply=%s\n' "$height" "$mempool" "$supply"
          test "$mempool" -ge 1
          echo "height=$height" >> "$GITHUB_OUTPUT"
          echo "supply=$supply" >> "$GITHUB_OUTPUT"

      - name: Mine exactly one transaction-containing block
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/current-faucet-confirmation"
          log="$RUNNER_TEMP/current-faucet-confirmation.log"
          node_id="current-faucet-confirmation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          "$RUNNER_TEMP/sudharmad" \
            -nodeid "$node_id" \
            -listen 127.0.0.1:0 \
            -peer "$SEED" \
            -datadir "$data" \
            -mineblocks 1 \
            -testmineraddress "$REWARD_ADDRESS" \
            > >(tee "$log") 2>&1 &
          pid=$!

          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill -INT "$pid" 2>/dev/null || true
              wait "$pid" || true
            fi
          }
          trap cleanup EXIT

          for attempt in $(seq 1 120); do
            if grep -Eq 'Pending Transactions: [1-9][0-9]*' "$log" 2>/dev/null \
              && grep -Eq 'Block #[0-9]+ found .* Transactions: [1-9][0-9]*' "$log" 2>/dev/null \
              && grep -q 'Remaining Pending Transactions: 0' "$log" 2>/dev/null; then
              cleanup
              trap - EXIT
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              cat "$log" >&2 || true
              exit 1
            fi
            sleep 0.5
          done

          echo 'Timed out waiting for the bounded confirmation block.' >&2
          cat "$log" >&2 || true
          exit 1

      - name: Verify exact network transition
        shell: bash
        env:
          BEFORE_HEIGHT: ${{ steps.before.outputs.height }}
          BEFORE_SUPPLY: ${{ steps.before.outputs.supply }}
        run: |
          set -euo pipefail
          expected_height=$((BEFORE_HEIGHT + 1))
          expected_supply=$((BEFORE_SUPPLY + 5000000000))

          for attempt in $(seq 1 24); do
            status="$(curl -fsS --max-time 15 "$API/v1/status")"
            height="$(printf '%s' "$status" | jq -r '.height')"
            mempool="$(printf '%s' "$status" | jq -r '.mempool')"
            supply="$(printf '%s' "$status" | jq -r '.issued_supply')"
            printf 'Verify %s: height=%s mempool=%s supply=%s\n' "$attempt" "$height" "$mempool" "$supply"
            if [ "$height" -eq "$expected_height" ] \
              && [ "$mempool" -eq 0 ] \
              && [ "$supply" -eq "$expected_supply" ]; then
              exit 0
            fi
            sleep 5
          done

          echo 'The expected one-block confirmation transition was not observed.' >&2
          exit 1
