name: CI

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main
      - cursor/mainnet-tokenomics-v1-8441

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tracked secret safety test
        run: bash ./scripts/check-tracked-secrets_test.sh

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Telegram bridge tests
        run: node --test scripts/telegram/*.test.js

      - name: Enforce manual-only live mutation workflows
        run: node --test scripts/live-workflow-trigger-safety.test.mjs

      - name: Install public RPC Lambda dependencies
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify clean-checkout build reproducibility
        run: bash ./scripts/check-build-reproducibility_test.sh

      - name: Run public RPC Lambda tests
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm test

      - name: Scan tracked files for secrets
        run: bash ./scripts/check-tracked-secrets.sh

      - name: Verify demand-miner CI safety gates
        run: bash ./scripts/check-demand-miner-ci_test.sh

      - name: Verify canonical faucet recovery contract
        run: bash ./scripts/check-canonical-faucet-recovery-contract_test.sh

      - name: Verify explorer API contract
        run: bash ./scripts/check-explorer-api-contract_test.sh

      - name: Verify GPU mining API contract
        run: bash ./scripts/check-mining-api-contract_test.sh

      - name: Verify pool mining contract
        run: bash ./scripts/check-pool-mining-contract_test.sh

      - name: Verify mining readiness contract
        run: bash ./scripts/check-mining-readiness-contract_test.sh

      - name: Run pool mining smoke tests
        run: bash ./scripts/pool-mining-smoke_test.sh

      - name: Verify testnet RC readiness contract
        run: bash ./scripts/check-testnet-rc-readiness_test.sh

      - name: Verify testnet go-live operator toolkit
        run: bash ./scripts/check-testnet-go-live-readiness_test.sh

      - name: Verify mainnet readiness contract
        run: bash ./scripts/check-mainnet-readiness-contract_test.sh

      - name: Verify mainnet go-live operator toolkit
        run: bash ./scripts/check-mainnet-go-live-readiness_test.sh

      - name: Verify mainnet merge review contract
        run: bash ./scripts/check-mainnet-merge-review-contract_test.sh

      - name: Run mainnet monetary rehearsal
        run: bash ./scripts/mainnet-monetary-rehearsal.sh

      - name: Verify pre-audit engineering selfcheck
        run: bash ./scripts/check-pre-audit-selfcheck-contract_test.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$unformatted" || {
            printf 'Files requiring gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Run focused demand-miner tests
        run: go test ./demandminer ./cmd/sudharma-demand-miner -count=1

      - name: Run focused demand-miner race tests
        run: go test -race ./demandminer ./cmd/sudharma-demand-miner -count=1

      - name: Run Go vet
        run: go vet ./...

      - name: Build demand-miner binaries
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/sudharma-demand-miner" ./cmd/sudharma-demand-miner
          go build -trimpath -o "$RUNNER_TEMP/sudharmad" ./cmd/sudharmad
          go build -trimpath -o "$RUNNER_TEMP/sudharma-mainnet-readiness" ./cmd/sudharma-mainnet-readiness
          go build -trimpath -o "$RUNNER_TEMP/sudharma-mainnet-genesis-info" ./cmd/sudharma-mainnet-genesis-info
          go build -trimpath -o "$RUNNER_TEMP/sudharma-miner" ./cmd/sudharma-miner
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/sudharma-miner.exe" ./cmd/sudharma-miner

      - name: Run demand-miner installer safety test
        run: bash deployment/testnet/install-demand-miner_test.sh

      - name: Verify demand-miner systemd unit
        shell: bash
        run: |
          set -euo pipefail
          if command -v systemd-analyze >/dev/null 2>&1; then
            unit_root="$(mktemp -d)"
            cp deployment/testnet/sudharma-testnet.service "$unit_root/sudharma.service"
            cp deployment/testnet/sudharma-demand-miner.service "$unit_root/sudharma-demand-miner.service"
            sed -i 's#^ExecStart=.*#ExecStart=/bin/true#' "$unit_root/sudharma.service" "$unit_root/sudharma-demand-miner.service"
            systemd-analyze verify "$unit_root/sudharma.service" "$unit_root/sudharma-demand-miner.service"
          else
            echo 'systemd-analyze is unavailable on this runner; skipping unit verification.'
          fi

      - name: Run tests
        run: go test ./... -count=1

      - name: Run repository-wide race detector
        run: go test -race ./... -count=1

      - name: Run local two-node testnet rehearsal
        run: bash ./scripts/testnet-rehearsal.sh

      - name: Build public testnet container
        run: docker build -f deployment/testnet/Dockerfile -t sudharma-testnet-ci .

      - name: Smoke test public testnet container
        run: |
          set -euo pipefail
          docker run -d --name sudharma-testnet-ci-node \
            -p 127.0.0.1:28555:28545 \
            -v "$PWD/deployment/testnet/seed1.node.example.json:/etc/sudharma/node.json:ro" \
            sudharma-testnet-ci
          trap 'docker rm -f sudharma-testnet-ci-node >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:28555/ready >/dev/null; then
              curl --fail --silent http://127.0.0.1:28555/v1/status
              exit 0
            fi
            sleep 0.5
          done
          docker logs sudharma-testnet-ci-node
          exit 1
