name: CI

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -count=1

      - name: Run P2P lifecycle race detector
        run: go test -race ./p2p -count=1 -run 'Test(MalformedInboundHandshake|TruncatedInboundHandshake|InboundHandshakeCapacity|RepeatedConnectDisconnect|Stop|StalledInboundHandshake|LiveInboundHandshake|RejectDuplicatePeerConnection|RejectSelfConnection|StorePeer|InboundHandshakeSlots|EstablishedPeer)'
