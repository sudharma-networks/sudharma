name: Testnet Public RPC

on:
  push:
    branches:
      - feature/faucet-recovery-stage2
    paths:
      - 'deployment/testnet/public-rpc/lambda/**'
      - '.github/workflows/testnet-public-rpc.yml'
      - 'scripts/check-faucet-deploy-contract_test.sh'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested artifact to the public testnet Lambda
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment contract
        run: bash ./scripts/check-faucet-deploy-contract_test.sh

      - name: Run tracked secret safety test
        run: bash ./scripts/check-tracked-secrets_test.sh

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Lambda dependencies
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test Lambda proxy and faucet
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm test

      - name: Package tested Lambda artifact
        run: |
          set -euo pipefail
          mkdir -p build/public-rpc
          cd deployment/testnet/public-rpc/lambda
          zip -q -9 -r "$GITHUB_WORKSPACE/build/public-rpc/sudharma-testnet-wallet-proxy.zip" \
            index.mjs router.mjs upstream.mjs faucet.mjs faucet-runtime.mjs visitor-runtime.mjs package.json node_modules

      - name: Upload tested Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-testnet-wallet-proxy
          path: build/public-rpc/sudharma-testnet-wallet-proxy.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
      AWS_REGION: ap-south-1
      LAMBDA_NAME: Sudharma-Testnet-Wallet-Proxy
      FAUCET_TABLE_NAME: Sudharma-Testnet-Faucet
      FAUCET_SECRET_ID: sudharma/testnet/faucet-wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact tested artifact
        uses: actions/download-artifact@v4
        with:
          name: sudharma-testnet-wallet-proxy
          path: build/public-rpc

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Verify AWS identity and faucet resources
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          aws dynamodb describe-table \
            --table-name "$FAUCET_TABLE_NAME" \
            --query 'Table.{Name:TableName,Status:TableStatus}' \
            --output json
          aws secretsmanager describe-secret \
            --secret-id "$FAUCET_SECRET_ID" \
            --query '{Name:Name,ARN:ARN}' \
            --output json

      - name: Snapshot Lambda environment
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --query 'Environment.Variables' \
            --output json > /tmp/lambda-environment-base.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = JSON.parse(fs.readFileSync('/tmp/lambda-environment-base.json', 'utf8')) ?? {};
          const common = {
            SEED_1_URL: 'http://172.31.10.171:29100',
            SEED_2_URL: 'http://172.31.32.195:29100',
            UPSTREAM_TIMEOUT_MS: '3500',
            FAUCET_TABLE_NAME: process.env.FAUCET_TABLE_NAME,
            FAUCET_SECRET_ID: process.env.FAUCET_SECRET_ID,
          };
          fs.writeFileSync('/tmp/lambda-environment-disabled.json', JSON.stringify({ Variables: { ...base, ...common, FAUCET_ENABLED: 'false' } }));
          fs.writeFileSync('/tmp/lambda-environment-enabled.json', JSON.stringify({ Variables: { ...base, ...common, FAUCET_ENABLED: 'true' } }));
          NODE

      - name: Stage faucet disabled
        run: |
          set -euo pipefail
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --runtime nodejs24.x \
            --handler index.handler \
            --timeout 10 \
            --memory-size 128 \
            --environment file:///tmp/lambda-environment-disabled.json \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_NAME"

      - name: Update Lambda code from tested artifact
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file fileb://build/public-rpc/sudharma-testnet-wallet-proxy.zip \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_NAME"

      - name: Verify shared public RPC before faucet activation
        run: |
          set -euo pipefail
          curl -fsS "$RPC_BASE_URL/v1/status" >/tmp/status.json
          node -e "const s=require('/tmp/status.json'); if (!s || s.network !== 'sudharma') process.exit(1); console.log(JSON.stringify({network:s.network,coin:s.coin,symbol:s.symbol,height:s.height,peers:s.peers}))"

          curl -fsS "$RPC_BASE_URL/v1/website/visitors" >/tmp/visitors.json
          node -e "const v=require('/tmp/visitors.json'); if (!Number.isSafeInteger(v.total) || v.total < 0) process.exit(1); console.log(JSON.stringify({website_visitors:v.total}))"

          curl -fsS "$RPC_BASE_URL/v1/explorer/status" >/tmp/explorer-status.json
          node -e "const e=require('/tmp/explorer-status.json'); if (!e || typeof e !== 'object') process.exit(1); console.log(JSON.stringify({explorer_status:'ok'}))"

      - name: Activate faucet and smoke-test public readiness
        run: |
          set -euo pipefail
          disable_faucet() {
            aws lambda update-function-configuration \
              --function-name "$LAMBDA_NAME" \
              --environment file:///tmp/lambda-environment-disabled.json \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$LAMBDA_NAME"
          }

          fail_closed() {
            echo "$1"
            if [ -n "${2:-}" ]; then
              printf '%s\n' "$2"
            fi
            disable_faucet
            exit 1
          }

          trap 'disable_faucet' ERR

          aws lambda update-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --environment file:///tmp/lambda-environment-enabled.json \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_NAME"

          info_response="$(curl -sS -w '\n%{http_code}' "$RPC_BASE_URL/v1/faucet/info")"
          info_status="$(printf '%s\n' "$info_response" | tail -n1)"
          info_body="$(printf '%s\n' "$info_response" | sed '$d')"
          if [ "$info_status" != '200' ]; then
            fail_closed "Faucet info smoke test returned HTTP $info_status; disabling faucet again." "$info_body"
          fi
          if ! BODY="$info_body" node --input-type=module -e "const body=JSON.parse(process.env.BODY); if (body.enabled !== true || typeof body.challenge_address !== 'string') process.exit(1); console.log(JSON.stringify({enabled:body.enabled,challenge_address:body.challenge_address,initial_grant_sudh:body.initial_grant_sudh,challenge_send_sudh:body.challenge_send_sudh,challenge_reward_sudh:body.challenge_reward_sudh,max_rounds:body.max_rounds,cooldown_hours:body.cooldown_hours,testnet_only:body.testnet_only}))"; then
            fail_closed 'Faucet info payload validation failed; disabling faucet again.' "$info_body"
          fi

          health_response="$(curl -sS -w '\n%{http_code}' "$RPC_BASE_URL/v1/faucet/health")"
          health_status="$(printf '%s\n' "$health_response" | tail -n1)"
          health_body="$(printf '%s\n' "$health_response" | sed '$d')"
          if [ "$health_status" != '200' ]; then
            fail_closed "Faucet deep health returned HTTP $health_status; disabling faucet again." "$health_body"
          fi
          if ! BODY="$health_body" node --input-type=module -e "const body=JSON.parse(process.env.BODY); if (body.ready !== true) process.exit(1); console.log(JSON.stringify({ready:body.ready}))"; then
            fail_closed 'Faucet deep health payload validation failed; disabling faucet again.' "$health_body"
          fi

          trap - ERR

      - name: Verify shared public RPC after faucet activation
        run: |
          set -euo pipefail
          curl -fsS "$RPC_BASE_URL/v1/status" >/dev/null
          curl -fsS "$RPC_BASE_URL/v1/website/visitors" >/dev/null
          curl -fsS "$RPC_BASE_URL/v1/explorer/status" >/dev/null

      - name: Verify deployed Lambda configuration
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --query '{Runtime:Runtime,Handler:Handler,Timeout:Timeout,MemorySize:MemorySize,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json
