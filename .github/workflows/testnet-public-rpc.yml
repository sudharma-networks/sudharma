# OIDC trust verified for the Sudharma repository. Deployment remains branch-gated below.
name: Testnet Public RPC

on:
  push:
    branches:
      - 'security/**'
      - feature/android-wallet-v0.1
      - feature/public-testnet-wallet-v2
    paths:
      - 'deployment/testnet/public-rpc/lambda/**'
      - 'deployment/testnet/public-rpc/**.json'
      - '.github/workflows/testnet-public-rpc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tracked secret safety test
        run: bash ./scripts/check-tracked-secrets_test.sh

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Lambda dependencies
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test Lambda proxy and faucet
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm test

      - name: Package Lambda
        run: |
          set -euo pipefail
          mkdir -p build/public-rpc
          cd deployment/testnet/public-rpc/lambda
          zip -q -9 -r "$GITHUB_WORKSPACE/build/public-rpc/sudharma-testnet-wallet-proxy.zip" \
            index.mjs router.mjs upstream.mjs faucet.mjs faucet-runtime.mjs package.json node_modules

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-testnet-wallet-proxy
          path: build/public-rpc/sudharma-testnet-wallet-proxy.zip
          if-no-files-found: error
          retention-days: 14

  inspect-faucet-aws:
    if: github.ref == 'refs/heads/feature/public-testnet-wallet-v2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print safe GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          TOKEN="$token" python3 - <<'PY'
          import base64, json, os
          token = os.environ['TOKEN']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('aud', 'sub', 'repository', 'ref'):
              print(f'{key}={claims.get(key)}')
          PY

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Inspect Lambda execution role
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name Sudharma-Testnet-Wallet-Proxy \
            --query '{Role:Role,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json

      - name: Check faucet table without changing AWS
        run: |
          if aws dynamodb describe-table --table-name Sudharma-Testnet-Faucet --query 'Table.{Name:TableName,Status:TableStatus,KeySchema:KeySchema}' --output json; then
            echo 'FAUCET_TABLE_EXISTS=true'
          else
            echo 'FAUCET_TABLE_EXISTS=false'
          fi

      - name: Check faucet secret metadata without reading secret value
        run: |
          if aws secretsmanager describe-secret --secret-id sudharma/testnet/faucet-wallet --query '{Name:Name,ARN:ARN}' --output json; then
            echo 'FAUCET_SECRET_EXISTS=true'
          else
            echo 'FAUCET_SECRET_EXISTS=false'
          fi

  provision-faucet:
    if: github.ref == 'refs/heads/feature/public-testnet-wallet-v2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Create faucet state table if missing
        shell: bash
        run: |
          set -euo pipefail
          if aws dynamodb describe-table --table-name Sudharma-Testnet-Faucet >/dev/null 2>&1; then
            echo 'Faucet table already exists; leaving it unchanged.'
          else
            aws dynamodb create-table \
              --table-name Sudharma-Testnet-Faucet \
              --attribute-definitions AttributeName=pk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --sse-specification Enabled=true \
              --tags Key=Project,Value=Sudharma Key=Environment,Value=Testnet Key=Purpose,Value=Faucet \
              --no-cli-pager >/dev/null
            aws dynamodb wait table-exists --table-name Sudharma-Testnet-Faucet
            echo 'Created Sudharma-Testnet-Faucet.'
          fi

      - name: Create dedicated faucet wallet secret if missing
        id: faucet_wallet
        shell: bash
        run: |
          set -euo pipefail
          SECRET_ID='sudharma/testnet/faucet-wallet'
          SECRET_FILE="${RUNNER_TEMP}/sudharma-faucet-wallet.json"
          trap 'rm -f "$SECRET_FILE"' EXIT

          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            echo 'Faucet wallet secret already exists; refusing to rotate it automatically.'
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SECRET_FILE="$SECRET_FILE" node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { createSigner } from './deployment/testnet/public-rpc/lambda/faucet.mjs';

          let scalar;
          let signer;
          for (;;) {
            scalar = randomBytes(32).toString('hex');
            try {
              signer = createSigner(scalar);
              break;
            } catch {
              // Extremely unlikely: draw another valid P-256 private scalar.
            }
          }

          writeFileSync(process.env.SECRET_FILE, JSON.stringify({ private_scalar_hex: scalar }), { mode: 0o600 });
          console.log(`Faucet public challenge address: ${signer.address}`);
          writeFileSync(process.env.GITHUB_OUTPUT, `challenge_address=${signer.address}\n`, { flag: 'a' });
          NODE

          aws secretsmanager create-secret \
            --name "$SECRET_ID" \
            --description 'Sudharma public testnet faucet signing wallet. TESTNET ONLY.' \
            --secret-string "file://${SECRET_FILE}" \
            --tags Key=Project,Value=Sudharma Key=Environment,Value=Testnet Key=Purpose,Value=Faucet \
            --no-cli-pager >/dev/null
          echo 'created=true' >> "$GITHUB_OUTPUT"
          echo 'Created dedicated faucet wallet secret; private scalar was not printed.'

      - name: Verify provisioned resource metadata
        shell: bash
        run: |
          set -euo pipefail
          aws dynamodb describe-table \
            --table-name Sudharma-Testnet-Faucet \
            --query 'Table.{Name:TableName,Status:TableStatus,BillingMode:BillingModeSummary.BillingMode,SSE:SSEDescription.Status}' \
            --output json
          aws secretsmanager describe-secret \
            --secret-id sudharma/testnet/faucet-wallet \
            --query '{Name:Name,ARN:ARN}' \
            --output json

  deploy:
    if: github.ref == 'refs/heads/feature/android-wallet-v0.1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Lambda dependencies
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test Lambda proxy and faucet again before deployment
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm test

      - name: Package Lambda
        run: |
          set -euo pipefail
          mkdir -p build/public-rpc
          cd deployment/testnet/public-rpc/lambda
          zip -q -9 -r "$GITHUB_WORKSPACE/build/public-rpc/sudharma-testnet-wallet-proxy.zip" \
            index.mjs router.mjs upstream.mjs faucet.mjs faucet-runtime.mjs package.json node_modules

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Update Lambda code
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name Sudharma-Testnet-Wallet-Proxy \
            --zip-file fileb://build/public-rpc/sudharma-testnet-wallet-proxy.zip \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name Sudharma-Testnet-Wallet-Proxy

      - name: Update non-secret Lambda configuration
        run: |
          set -euo pipefail
          aws lambda update-function-configuration \
            --function-name Sudharma-Testnet-Wallet-Proxy \
            --runtime nodejs24.x \
            --handler index.handler \
            --timeout 10 \
            --memory-size 128 \
            --environment 'Variables={SEED_1_URL=http://172.31.10.171:29100,SEED_2_URL=http://172.31.32.195:29100,UPSTREAM_TIMEOUT_MS=3500}' \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name Sudharma-Testnet-Wallet-Proxy

      - name: Verify deployed Lambda configuration
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name Sudharma-Testnet-Wallet-Proxy \
            --query '{Runtime:Runtime,Handler:Handler,Timeout:Timeout,MemorySize:MemorySize,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output json
