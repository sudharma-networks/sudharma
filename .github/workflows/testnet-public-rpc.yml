# OIDC trust verified for the Sudharma repository.
# Staged faucet activation rerun after private AWS connectivity verification.
name: Testnet Public RPC

on:
  push:
    branches:
      - 'security/**'
      - feature/android-wallet-v0.1
      - feature/public-testnet-wallet-v2
      - feature/wallet-auto-testnet-flow
    paths:
      - 'deployment/testnet/public-rpc/lambda/**'
      - 'deployment/testnet/public-rpc/**.json'
      - '.github/workflows/testnet-public-rpc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tracked secret safety test
        run: bash ./scripts/check-tracked-secrets_test.sh
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Lambda dependencies
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Lambda proxy, faucet and website visitor counter
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm test
      - name: Package Lambda
        run: |
          set -euo pipefail
          mkdir -p build/public-rpc
          cd deployment/testnet/public-rpc/lambda
          zip -q -9 -r "$GITHUB_WORKSPACE/build/public-rpc/sudharma-testnet-wallet-proxy.zip" index.mjs router.mjs upstream.mjs faucet.mjs faucet-runtime.mjs visitor-runtime.mjs package.json node_modules
      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-testnet-wallet-proxy
          path: build/public-rpc/sudharma-testnet-wallet-proxy.zip
          if-no-files-found: error
          retention-days: 14

  provision-faucet:
    if: github.ref == 'refs/heads/feature/public-testnet-wallet-v2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1
      - name: Verify faucet resources exist
        shell: bash
        run: |
          set -euo pipefail
          aws dynamodb describe-table --table-name Sudharma-Testnet-Faucet --query 'Table.{Name:TableName,Status:TableStatus}' --output json
          aws secretsmanager describe-secret --secret-id sudharma/testnet/faucet-wallet --query '{Name:Name,ARN:ARN}' --output json

  deploy:
    if: github.ref == 'refs/heads/feature/public-testnet-wallet-v2'
    needs: [build, provision-faucet]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Lambda dependencies
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Lambda proxy, faucet and website visitor counter again before deployment
        working-directory: deployment/testnet/public-rpc/lambda
        run: npm test
      - name: Package Lambda
        run: |
          set -euo pipefail
          mkdir -p build/public-rpc
          cd deployment/testnet/public-rpc/lambda
          zip -q -9 -r "$GITHUB_WORKSPACE/build/public-rpc/sudharma-testnet-wallet-proxy.zip" index.mjs router.mjs upstream.mjs faucet.mjs faucet-runtime.mjs visitor-runtime.mjs package.json node_modules
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1
      - name: Update Lambda code
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name Sudharma-Testnet-Wallet-Proxy --zip-file fileb://build/public-rpc/sudharma-testnet-wallet-proxy.zip --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name Sudharma-Testnet-Wallet-Proxy
      - name: Stage faucet disabled
        run: |
          set -euo pipefail
          aws lambda update-function-configuration --function-name Sudharma-Testnet-Wallet-Proxy --runtime nodejs24.x --handler index.handler --timeout 10 --memory-size 128 --environment 'Variables={SEED_1_URL=http://172.31.10.171:29100,SEED_2_URL=http://172.31.32.195:29100,UPSTREAM_TIMEOUT_MS=3500,FAUCET_ENABLED=false,FAUCET_TABLE_NAME=Sudharma-Testnet-Faucet,FAUCET_SECRET_ID=sudharma/testnet/faucet-wallet}' --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name Sudharma-Testnet-Wallet-Proxy
      - name: Verify normal public RPC before faucet activation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${RPC_BASE_URL}/v1/status" | jq '{network,coin,symbol,height,peers}'
      - name: Verify website visitor counter read route
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${RPC_BASE_URL}/v1/website/visitors" | jq -e '.total | numbers' >/dev/null
      - name: Activate faucet and deep smoke-test protected dependencies
        shell: bash
        run: |
          set -euo pipefail
          disable_faucet() {
            aws lambda update-function-configuration --function-name Sudharma-Testnet-Wallet-Proxy --environment 'Variables={SEED_1_URL=http://172.31.10.171:29100,SEED_2_URL=http://172.31.32.195:29100,UPSTREAM_TIMEOUT_MS=3500,FAUCET_ENABLED=false,FAUCET_TABLE_NAME=Sudharma-Testnet-Faucet,FAUCET_SECRET_ID=sudharma/testnet/faucet-wallet}' --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name Sudharma-Testnet-Wallet-Proxy
          }
          aws lambda update-function-configuration --function-name Sudharma-Testnet-Wallet-Proxy --environment 'Variables={SEED_1_URL=http://172.31.10.171:29100,SEED_2_URL=http://172.31.32.195:29100,UPSTREAM_TIMEOUT_MS=3500,FAUCET_ENABLED=true,FAUCET_TABLE_NAME=Sudharma-Testnet-Faucet,FAUCET_SECRET_ID=sudharma/testnet/faucet-wallet}' --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name Sudharma-Testnet-Wallet-Proxy

          response="$(curl -sS -w '\n%{http_code}' "${RPC_BASE_URL}/v1/faucet/health")"
          status="$(printf '%s\n' "$response" | tail -n1)"
          body="$(printf '%s\n' "$response" | sed '$d')"
          if [ "$status" != '200' ] || ! printf '%s\n' "$body" | jq -e '.ready == true' >/dev/null; then
            echo "Faucet deep health check failed with HTTP ${status}; disabling faucet again."
            printf '%s\n' "$body"
            disable_faucet
            exit 1
          fi
          printf '%s\n' "$body" | jq '{ready}'

          info_response="$(curl -sS -w '\n%{http_code}' "${RPC_BASE_URL}/v1/faucet/info")"
          info_status="$(printf '%s\n' "$info_response" | tail -n1)"
          info_body="$(printf '%s\n' "$info_response" | sed '$d')"
          if [ "$info_status" != '200' ]; then
            echo "Faucet info smoke test returned HTTP ${info_status}; disabling faucet again."
            printf '%s\n' "$info_body"
            disable_faucet
            exit 1
          fi
          printf '%s\n' "$info_body" | jq '{enabled,challenge_address,initial_grant_sudh,challenge_send_sudh,challenge_reward_sudh,max_rounds,cooldown_hours,testnet_only}'
      - name: Verify normal public RPC after faucet activation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${RPC_BASE_URL}/v1/status" | jq '{network,coin,symbol,height,peers}'
      - name: Verify deployed Lambda configuration
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name Sudharma-Testnet-Wallet-Proxy --query '{Runtime:Runtime,Handler:Handler,Timeout:Timeout,MemorySize:MemorySize,State:State,LastUpdateStatus:LastUpdateStatus}' --output json
