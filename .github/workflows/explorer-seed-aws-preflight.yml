name: Explorer Seed AWS Preflight

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/explorer-seed-aws-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      SEED_PRIVATE_IPS: '172.31.10.171 172.31.32.195'
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Discover seed SSM readiness without changes
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for private_ip in $SEED_PRIVATE_IPS; do
            index=$((index + 1))
            set +e
            record="$(aws ssm describe-instance-information \
              --query "InstanceInformationList[?IPAddress=='${private_ip}'] | [0].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
              --output text 2>&1)"
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              echo "seed-${index}: SSM discovery not authorized or unavailable" >&2
              printf '%s\n' "$record" >&2
              exit "$status"
            fi
            if [ -z "$record" ] || [ "$record" = 'None' ]; then
              echo "seed-${index}: no SSM-managed instance reports private IP ${private_ip}" >&2
              exit 1
            fi

            read -r instance_id ping_status platform_name agent_version <<< "$record"
            if [ -z "$instance_id" ] || [ "$instance_id" = 'None' ]; then
              echo "seed-${index}: SSM returned no instance id" >&2
              exit 1
            fi
            echo "::add-mask::$instance_id"
            echo "seed-${index}: ssm=${ping_status:-unknown} platform=${platform_name:-unknown} agent=${agent_version:-unknown}"
          done

      - name: Record safety boundary
        if: always()
        shell: bash
        run: |
          echo 'aws-mode=read-only'
          echo 'seed-service-restarts=0'
          echo 'seed-binaries-changed=0'
          echo 'rpc-firewall-changes=0'
          echo 'gpu-pow-deployment=0'
          echo 'explorer-preflight=trusted-branch'
