name: Explorer Seed AWS Preflight

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/explorer-seed-aws-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      SEED_PRIVATE_IPS: '172.31.10.171 172.31.32.195'
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Inspect seed EC2 instance profiles without changes
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for private_ip in $SEED_PRIVATE_IPS; do
            index=$((index + 1))
            set +e
            record="$(aws ec2 describe-instances \
              --filters "Name=private-ip-address,Values=${private_ip}" 'Name=instance-state-name,Values=running' \
              --query 'Reservations[0].Instances[0].[InstanceId,State.Name,IamInstanceProfile.Arn]' \
              --output text 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "seed-${index}: EC2 discovery not authorized or unavailable" >&2
              printf '%s\n' "$record" >&2
              exit "$status"
            fi
            if [ -z "$record" ] || [ "$record" = 'None' ]; then
              echo "seed-${index}: running EC2 instance not found for private IP ${private_ip}" >&2
              exit 1
            fi
            read -r instance_id instance_state instance_profile <<< "$record"
            echo "::add-mask::$instance_id"
            if [ -z "$instance_profile" ] || [ "$instance_profile" = 'None' ]; then
              profile_state='absent'
            else
              profile_state='present'
            fi
            echo "seed-${index}: ec2=${instance_state:-unknown} iam-instance-profile=${profile_state}"
          done

      - name: Discover seed SSM readiness without changes
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for private_ip in $SEED_PRIVATE_IPS; do
            index=$((index + 1))
            record="$(aws ssm describe-instance-information \
              --query "InstanceInformationList[?IPAddress=='${private_ip}'] | [0].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
              --output text)"
            if [ -z "$record" ] || [ "$record" = 'None' ]; then
              echo "seed-${index}: no SSM-managed instance reports private IP ${private_ip}" >&2
              exit 1
            fi
            read -r instance_id ping_status platform_name agent_version <<< "$record"
            echo "::add-mask::$instance_id"
            echo "seed-${index}: ssm=${ping_status:-unknown} platform=${platform_name:-unknown} agent=${agent_version:-unknown}"
          done

      - name: Record safety boundary
        if: always()
        shell: bash
        run: |
          echo 'aws-mode=read-only'
          echo 'seed-service-restarts=0'
          echo 'seed-binaries-changed=0'
          echo 'rpc-firewall-changes=0'
          echo 'gpu-pow-deployment=0'
          echo 'explorer-preflight=trusted-branch'
