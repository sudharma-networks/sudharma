name: Faucet Payout Diagnostic

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/faucet-payout-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Check live public endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com'
          echo '=== public RPC ==='
          curl -sS --max-time 10 -w '\nHTTP %{http_code}\n' "$BASE/v1/status"
          echo '=== faucet info ==='
          curl -sS --max-time 10 -w '\nHTTP %{http_code}\n' "$BASE/v1/faucet/info"

      - name: Inspect Lambda state without secret values
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name Sudharma-Testnet-Wallet-Proxy \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus,Timeout:Timeout,VpcId:VpcConfig.VpcId,SubnetIds:VpcConfig.SubnetIds,SecurityGroupIds:VpcConfig.SecurityGroupIds}' \
            --output json

      - name: Read recent payout failure logs
        shell: bash
        run: |
          set -euo pipefail
          aws logs tail /aws/lambda/Sudharma-Testnet-Wallet-Proxy --since 6h --format short \
            | grep -E -A 60 -B 15 'faucet|initial|grant|payout|broadcast|transaction|tx|temporarily unavailable|Task timed out|AccessDenied|ValidationException|ConditionalCheckFailed|ResourceNotFound|ECONN|ETIMEDOUT|ERROR|Error|REPORT' \
            | tail -n 800 || true
