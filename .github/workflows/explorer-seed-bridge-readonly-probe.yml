name: Explorer Seed Bridge Read-Only Probe

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/explorer-seed-bridge-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      SEED_PRIVATE_IPS: '172.31.10.171 172.31.32.195'
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Inspect port 29100 and nginx routing without changes
        shell: bash
        run: |
          set -euo pipefail
          index=0
          for private_ip in $SEED_PRIVATE_IPS; do
            index=$((index + 1))
            instance_id="$(aws ssm describe-instance-information \
              --query "InstanceInformationList[?IPAddress=='${private_ip}' && PingStatus=='Online'] | [0].InstanceId" \
              --output text)"
            if [ -z "$instance_id" ] || [ "$instance_id" = 'None' ]; then
              echo "seed-${index}: Online SSM instance not found" >&2
              exit 1
            fi
            echo "::add-mask::$instance_id"

            remote_script="$(cat <<EOF
          set -eu
          echo seed_index=${index}
          echo private_ip=${private_ip}
          printf 'sudharma_service='; systemctl is-active sudharma.service || true
          printf 'nginx_service='; systemctl is-active nginx.service || true
          echo 'listeners_29100:'
          ss -ltnp 2>/dev/null | grep ':29100' || true
          for host in 127.0.0.1 ${private_ip}; do
            for path in /v1/status /v1/explorer/status; do
              out="/tmp/sudharma-bridge-probe-\$(echo "\$host\$path" | tr '/:.' '____').json"
              code="\$(curl -sS -o "\$out" -w '%{http_code}' "http://\$host:29100\$path" || true)"
              echo "bridge_probe host=\$host path=\$path status=\$code"
              head -c 800 "\$out" 2>/dev/null || true
              echo
            done
          done
          echo 'nginx_route_snippets:'
          grep -RnsE 'listen[[:space:]]+29100|location|proxy_pass|v1/(status|explorer)' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 240 || true
          echo 'active_wallet_proxy_config:'
          sed -n '1,180p' /etc/nginx/sites-enabled/sudharma-wallet-proxy 2>/dev/null || true
          EOF
          )"
            parameters="$(jq -cn --arg command "$remote_script" '{commands:[$command]}')"
            command_id="$(aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name AWS-RunShellScript \
              --comment "Sudharma explorer private bridge read-only probe" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text)"
            echo "::add-mask::$command_id"

            for _ in $(seq 1 30); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query Status \
                --output text 2>/dev/null || true)"
              case "$status" in
                Success) break ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  echo "seed-${index}: bridge probe ended with $status" >&2
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$instance_id" \
                    --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                    --output json || true
                  exit 1
                  ;;
              esac
              sleep 2
            done

            result="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
              --output json)"
            echo "seed-${index}: $result"
            test "$(printf '%s' "$result" | jq -r '.status')" = 'Success'
          done

      - name: Record safety boundary
        if: always()
        shell: bash
        run: |
          echo 'probe-mode=read-only'
          echo 'seed-service-restarts=0'
          echo 'seed-binaries-changed=0'
          echo 'seed-config-changed=0'
          echo 'nginx-config-changed=0'
          echo 'rpc-firewall-changes=0'
          echo 'gpu-pow-deployment=0'
