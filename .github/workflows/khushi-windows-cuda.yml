name: Khushi NVIDIA Windows CUDA

on:
  push:
    branches:
      - feature/gpu-pow-v1
      - feature/gpu-autotune-profiles
    paths:
      - '.github/workflows/khushi-windows-cuda.yml'
      - '.github/workflows/khushi-windows-opencl.yml'
      - '.github/workflows/publish-test-mining-release.yml'
      - 'compatibility/cuda/**'
      - 'compatibility/opencl/**'
      - 'compatibility/gpu/**'
      - 'compatibility/gpupowv1/windows_artifact_contract_test.go'
      - 'compatibility/gpupowv1/device_memory_contract_test.go'
      - 'compatibility/gpupowv1/cuda_production_vector_cli_contract_test.go'
      - 'compatibility/gpupowv1/windows_self_contained_staging_release_contract_test.go'
      - 'cmd/sudharma-gpupow-staging/**'
      - 'rpc/mining_staging*.go'
      - 'scripts/windows/test-khushi-miner.ps1'
      - 'scripts/windows/run-local-staging-gate.ps1'
      - 'docs/gpu-pow-v1-production-memory-vectors.json'
      - 'docs/test-mining/PUBLIC_TEST_MINING.md'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "visual_studio_integration", "cudart"]'

      - name: CUDA compiler version
        shell: pwsh
        run: nvcc -V

      - name: Build Khushi Algorithm NVIDIA miner and production vector gate
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl.exe
          if not exist dist mkdir dist
          nvcc -std=c++17 --expt-relaxed-constexpr -O3 -lineinfo -Xcompiler "/EHsc" -gencode=arch=compute_61,code=sm_61 -gencode=arch=compute_75,code=sm_75 -gencode=arch=compute_86,code=sm_86 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_89,code=compute_89 -gencode=arch=compute_120,code=sm_120 -gencode=arch=compute_120,code=compute_120 compatibility\cuda\khushi_miner.cu -o dist\khushi-miner-nvidia.exe
          nvcc -std=c++17 --expt-relaxed-constexpr -O3 -lineinfo -Xcompiler "/EHsc" -gencode=arch=compute_61,code=sm_61 -gencode=arch=compute_75,code=sm_75 -gencode=arch=compute_86,code=sm_86 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_89,code=compute_89 -gencode=arch=compute_120,code=sm_120 -gencode=arch=compute_120,code=compute_120 compatibility\cuda\khushi_production_vectors.cu -o dist\khushi-production-vectors-nvidia.exe

      - name: Build same-revision local staging verifier
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o dist/sudharma-gpupow-staging.exe ./cmd/sudharma-gpupow-staging

      - name: Package CUDA runtime and frozen production vectors
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Path "$env:CUDA_PATH\bin" -Filter "cudart64_*.dll" | Select-Object -First 1
          if (-not $runtime) { throw "CUDA runtime DLL not found under CUDA_PATH" }
          Copy-Item $runtime.FullName -Destination dist
          Copy-Item docs/gpu-pow-v1-production-memory-vectors.json -Destination dist

      - name: Record provenance and checksums
        shell: pwsh
        run: |
          @(
            "algorithm=Khushi Algorithm",
            "protocol_id=sudharma-gpupow-v1",
            "source_revision=$env:GITHUB_SHA",
            "cuda_arches=sm_61,sm_75,sm_86,sm_89,compute_89,sm_120,compute_120",
            "artifact=khushi-miner-nvidia.exe",
            "production_vector_artifact=khushi-production-vectors-nvidia.exe",
            "staging_verifier_artifact=sudharma-gpupow-staging.exe",
            "staging_endpoint_default=127.0.0.1:28646",
            "staging_consensus_activation=disabled",
            "staging_block_creation=none",
            "production_dataset_bytes=2147483648",
            "production_cache_bytes=16777216",
            "production_chunk_bytes=268435456",
            "production_chunk_count=8",
            "minimum_dedicated_vram_bytes=4294967296"
          ) | Set-Content -Encoding ascii dist/build-metadata.txt
          nvcc -V 2>&1 | Add-Content -Encoding ascii dist/build-metadata.txt
          $miner = Get-FileHash -Algorithm SHA256 dist/khushi-miner-nvidia.exe
          $vectors = Get-FileHash -Algorithm SHA256 dist/khushi-production-vectors-nvidia.exe
          $verifier = Get-FileHash -Algorithm SHA256 dist/sudharma-gpupow-staging.exe
          $fixture = Get-FileHash -Algorithm SHA256 dist/gpu-pow-v1-production-memory-vectors.json
          @(
            "$($miner.Hash.ToLower())  khushi-miner-nvidia.exe",
            "$($vectors.Hash.ToLower())  khushi-production-vectors-nvidia.exe",
            "$($verifier.Hash.ToLower())  sudharma-gpupow-staging.exe",
            "$($fixture.Hash.ToLower())  gpu-pow-v1-production-memory-vectors.json"
          ) | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Package Windows hardware and local staging runners
        shell: pwsh
        run: |
          Copy-Item scripts/windows/test-khushi-miner.ps1 dist/test-khushi-miner.ps1
          Copy-Item scripts/windows/run-local-staging-gate.ps1 dist/run-local-staging-gate.ps1

      - name: Upload generic NVIDIA Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: khushi-miner-nvidia-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
