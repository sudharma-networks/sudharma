name: Android Wallet

on:
  push:
    branches:
      - feature/android-wallet-v0.1
      - cursor/wallet-txn-copy-83d4
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
      - 'docs/superpowers/specs/2026-08-25-android-wallet-v0.1.md'
      - 'docs/superpowers/plans/2026-08-25-android-wallet-v0.1.md'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create GitHub release with debug APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        working-directory: mobile/android
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-wallet-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-testnet-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sudharma-wallet-debug
          path: release
      - name: Prepare release assets
        id: assets
        working-directory: mobile/android
        run: |
          set -euo pipefail
          version_name="$(grep versionName app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          version_tag="${version_name/-testnet/}"
          apk_name="Sudharma-Wallet-${version_tag}.apk"
          cp "$GITHUB_WORKSPACE/release/app-debug.apk" "$GITHUB_WORKSPACE/$apk_name"
          sha256sum "$GITHUB_WORKSPACE/$apk_name" | awk '{print $1}' > "$GITHUB_WORKSPACE/$apk_name.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "tag=wallet-testnet-${version_tag}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.assets.outputs.tag }}'
          apk='${{ steps.assets.outputs.apk_name }}'
          gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" -y --cleanup-tag || true
          gh release create "$tag" \
            --title "Sudharma Wallet ${tag#wallet-testnet-} (testnet)" \
            --notes "Testnet wallet APK with transaction ID copy and public explorer links in Activity and Send screens." \
            --prerelease \
            "$apk" \
            "$apk.sha256"
