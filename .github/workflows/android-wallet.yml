name: Android Wallet

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
      - 'docs/superpowers/specs/2026-08-25-android-wallet-v0.1.md'
      - 'docs/superpowers/plans/2026-08-25-android-wallet-v0.1.md'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build testnet APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Stage named APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(python3 - <<'PY'
          import re
          text = open("mobile/android/app/build.gradle.kts", encoding="utf-8").read()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("versionName not found")
          print(match.group(1).removesuffix("-testnet"))
          PY
          )"
          apk_name="Sudharma-Wallet-${version_name}.apk"
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/${apk_name}"
          (
            cd dist
            sha256sum "${apk_name}" | tee "${apk_name}.sha256"
          )
          echo "Staged ${apk_name}"

      - name: Upload verified testnet APK
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-wallet-testnet
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
