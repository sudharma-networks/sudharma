name: Android Wallet

on:
  push:
    branches:
      - feature/android-wallet-v0.1
      - feature/android-wallet-branding-v0.1-finalwork
      - feature/public-testnet-wallet-v2
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
      - 'docs/superpowers/specs/2026-08-25-android-wallet-v0.1.md'
      - 'docs/superpowers/plans/2026-08-25-android-wallet-v0.1.md'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        working-directory: mobile/android
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-wallet-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
