name: Android Wallet

on:
  push:
    branches:
      - feature/android-wallet-v0.1
      - feature/android-wallet-branding-v0.1-finalwork
      - feature/public-testnet-wallet-v2
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
      - 'docs/superpowers/specs/2026-08-25-android-wallet-v0.1.md'
      - 'docs/superpowers/plans/2026-08-25-android-wallet-v0.1.md'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-wallet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        working-directory: mobile/android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        working-directory: mobile/android
        run: gradle --no-daemon :app:lintDebug

      - name: Build testnet APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage named APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/Sudharma-Wallet-0.1.0-testnet.apk
          sha256sum dist/Sudharma-Wallet-0.1.0-testnet.apk > dist/Sudharma-Wallet-0.1.0-testnet.apk.sha256

      - name: Upload verified testnet APK
        uses: actions/upload-artifact@v4
        with:
          name: sudharma-wallet-0.1.0-testnet
          path: |
            dist/Sudharma-Wallet-0.1.0-testnet.apk
            dist/Sudharma-Wallet-0.1.0-testnet.apk.sha256
          if-no-files-found: error
          retention-days: 14
