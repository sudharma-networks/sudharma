name: GPU-PoW v1 CI

on:
  push:
    branches:
      - feature/gpu-pow-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consensus-baseline:
    name: Consensus baseline and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo 'Files requiring gofmt:'
            echo "$bad"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Consensus baseline tests
        run: go test ./blockchain ./consensus -count=1 -v

      - name: Full regression suite
        run: go test ./... -count=1

      - name: Build node
        run: go build -trimpath -o /tmp/sudharma-rpcd ./cmd/sudharma-rpcd

      - name: Record build checksum
        run: sha256sum /tmp/sudharma-rpcd
