name: Step 1 Apply Daemon Patch

on:
  push:
    branches:
      - security/complete-network-aware-consensus
    paths:
      - .github/workflows/step1-apply-daemon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/complete-network-aware-consensus

      - name: Apply exact network-aware substitutions
        run: python3 scripts/step1_patch_sudharmad.py

      - name: Verify only intended daemon file changed
        shell: bash
        run: |
          git diff --exit-code -- . ':!cmd/sudharmad/main.go' || {
            echo 'Unexpected file changes detected' >&2
            exit 1
          }
          git diff --check
          git diff -- cmd/sudharmad/main.go

      - name: Commit daemon patch
        shell: bash
        run: |
          if git diff --quiet -- cmd/sudharmad/main.go; then
            echo 'Expected daemon patch produced no change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/sudharmad/main.go
          git commit -m 'fix: bind sudharmad startup to active network policy'
          git push origin HEAD:security/complete-network-aware-consensus
