name: Khushi Hardware Test v0.2.2

on:
  workflow_dispatch:
  push:
    branches:
      - security/khushi-v022-mainnet-rehearsal
      - main
    paths:
      - '.github/workflows/khushi-hardware-test-v0.2.2.yml'
      - 'cmd/sudharma-gpupow-staging/**'
      - 'pow/**'
      - 'compatibility/cuda/**'
      - 'compatibility/opencl/**'
      - 'scripts/windows/Run-GPU-Test.bat'
      - 'scripts/windows/run-local-staging-gate.ps1'
      - 'scripts/windows/test-khushi-miner.ps1'
      - 'docs/test-mining/KHUSHI_HARDWARE_TEST_V0_2_2.txt'

permissions:
  contents: read

jobs:
  go-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify isolated 25-block minimum rehearsal in Go
        run: go test ./cmd/sudharma-gpupow-staging -run TestMainnetRehearsalMinesAndAcceptsAtLeast25KhushiBlocks -count=1
      - name: Verify public mainnet gates remain closed
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MainnetLaunchAuthorized = false' params/network.go
          grep -F 'MainnetMiningAuthorized = false' params/mining.go
          grep -F 'MainnetGenesisTimestamp uint64 = 0' params/network.go
          grep -F 'GPUV1MainnetActivationHeight uint64 = GPUV1ActivationDisabled' params/mining.go
          grep -F 'PhysicalGPUMiningEvidenceComplete = false' params/security_review_evidence.go

  build-cuda:
    needs: go-rehearsal
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "visual_studio_integration", "cudart"]'
      - name: Build NVIDIA v0.2.2 miner and vectors
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist dist mkdir dist
          nvcc -std=c++17 --expt-relaxed-constexpr -O3 -lineinfo -Xcompiler "/EHsc" -gencode=arch=compute_61,code=sm_61 -gencode=arch=compute_75,code=sm_75 -gencode=arch=compute_86,code=sm_86 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_89,code=compute_89 -gencode=arch=compute_120,code=sm_120 -gencode=arch=compute_120,code=compute_120 compatibility\cuda\khushi_miner_v022.cu -o dist\khushi-miner-nvidia.exe
          nvcc -std=c++17 --expt-relaxed-constexpr -O3 -lineinfo -Xcompiler "/EHsc" -gencode=arch=compute_61,code=sm_61 -gencode=arch=compute_75,code=sm_75 -gencode=arch=compute_86,code=sm_86 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_89,code=compute_89 -gencode=arch=compute_120,code=sm_120 -gencode=arch=compute_120,code=compute_120 compatibility\cuda\khushi_production_vectors.cu -o dist\khushi-production-vectors-nvidia.exe
      - name: Build same-revision Windows consensus verifier
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o dist/sudharma-gpupow-staging.exe ./cmd/sudharma-gpupow-staging
      - name: Package NVIDIA runtime and scripts
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Path "$env:CUDA_PATH\bin" -Filter "cudart64_*.dll" | Select-Object -First 1
          if (-not $runtime) { throw "CUDA runtime DLL not found under CUDA_PATH" }
          Copy-Item $runtime.FullName -Destination dist
          Copy-Item docs/gpu-pow-v1-production-memory-vectors.json -Destination dist
          Copy-Item docs/gpu-pow-v1-interoperability-vectors.json -Destination dist
          Copy-Item scripts/windows/test-khushi-miner.ps1 -Destination dist
          Copy-Item scripts/windows/run-local-staging-gate.ps1 -Destination dist
      - name: Record NVIDIA provenance and checksums
        shell: pwsh
        run: |
          Write-Host "rehearsal-blocks 50"
          @(
            "package=Khushi Hardware Test v0.2.2",
            "algorithm=Khushi",
            "protocol_id=sudharma-gpupow-v1",
            "source_revision=$env:GITHUB_SHA",
            "backend=CUDA",
            "rehearsal_blocks=50",
            "production_consensus_cache_nodes=262144",
            "staging_endpoint_default=127.0.0.1:28646",
            "public_mainnet_launch=disabled",
            "public_mainnet_mining=disabled",
            "public_gpu_activation=disabled",
            "formal_benchmark_seconds=60",
            "physical_evidence_gate=not_automatically_completed",
            "production_dataset_bytes=2147483648",
            "production_cache_bytes=16777216",
            "production_runtime_reserve_bytes=268435456",
            "minimum_dedicated_vram_bytes=4294967296"
          ) | Set-Content -Encoding ascii dist/build-metadata.txt
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          if (-not (Select-String -Path dist/build-metadata.txt -SimpleMatch "source_revision=$env:GITHUB_SHA")) { throw 'source revision missing from NVIDIA metadata' }
      - name: Upload exact-revision NVIDIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: khushi-hardware-v0.2.2-nvidia-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-opencl:
    needs: go-rehearsal
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install OpenCL development package
        shell: pwsh
        run: vcpkg install opencl:x64-windows
      - name: Build OpenCL v0.2.2 miner and vectors
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /EHsc /DCL_TARGET_OPENCL_VERSION=120 /I"C:\vcpkg\installed\x64-windows\include" compatibility\opencl\khushi_miner_opencl_v022.cpp /link /LIBPATH:"C:\vcpkg\installed\x64-windows\lib" OpenCL.lib /OUT:dist\khushi-miner-opencl.exe
          cl /nologo /std:c++17 /O2 /EHsc /DCL_TARGET_OPENCL_VERSION=120 /I"C:\vcpkg\installed\x64-windows\include" compatibility\opencl\khushi_production_vectors_opencl.cpp /link /LIBPATH:"C:\vcpkg\installed\x64-windows\lib" OpenCL.lib /OUT:dist\khushi-production-vectors-opencl.exe
          copy /Y compatibility\opencl\khushi_pow.cl dist\khushi_pow.cl
          copy /Y compatibility\opencl\gpupow_v1_production_vectors.cl dist\gpupow_v1_production_vectors.cl
      - name: Build same-revision Windows consensus verifier
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o dist/sudharma-gpupow-staging.exe ./cmd/sudharma-gpupow-staging
      - name: Package OpenCL scripts
        shell: pwsh
        run: |
          Copy-Item docs/gpu-pow-v1-production-memory-vectors.json -Destination dist
          Copy-Item docs/gpu-pow-v1-interoperability-vectors.json -Destination dist
          Copy-Item scripts/windows/test-khushi-miner.ps1 -Destination dist
          Copy-Item scripts/windows/run-local-staging-gate.ps1 -Destination dist
      - name: Record OpenCL provenance and checksums
        shell: pwsh
        run: |
          Write-Host "rehearsal-blocks 50"
          @(
            "package=Khushi Hardware Test v0.2.2",
            "algorithm=Khushi",
            "protocol_id=sudharma-gpupow-v1",
            "source_revision=$env:GITHUB_SHA",
            "backend=OpenCL 1.2",
            "gpu_policy=GPU devices only; CPU fallback prohibited",
            "rehearsal_blocks=50",
            "production_consensus_cache_nodes=262144",
            "staging_endpoint_default=127.0.0.1:28646",
            "public_mainnet_launch=disabled",
            "public_mainnet_mining=disabled",
            "public_gpu_activation=disabled",
            "formal_benchmark_seconds=60",
            "physical_evidence_gate=not_automatically_completed",
            "minimum_dedicated_vram_bytes=4294967296"
          ) | Set-Content -Encoding ascii dist/build-metadata.txt
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          if (-not (Select-String -Path dist/build-metadata.txt -SimpleMatch "source_revision=$env:GITHUB_SHA")) { throw 'source revision missing from OpenCL metadata' }
      - name: Upload exact-revision OpenCL artifact
        uses: actions/upload-artifact@v4
        with:
          name: khushi-hardware-v0.2.2-opencl-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [build-cuda, build-opencl]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Download NVIDIA artifact
        uses: actions/download-artifact@v4
        with:
          name: khushi-hardware-v0.2.2-nvidia-${{ github.sha }}
          path: backend/nvidia
      - name: Download OpenCL artifact
        uses: actions/download-artifact@v4
        with:
          name: khushi-hardware-v0.2.2-opencl-${{ github.sha }}
          path: backend/opencl
      - name: Verify exact revision and backend checksums
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r' < backend/nvidia/build-metadata.txt | grep -Fx "source_revision=${GITHUB_SHA}"
          tr -d '\r' < backend/opencl/build-metadata.txt | grep -Fx "source_revision=${GITHUB_SHA}"
          sed -i 's/\r$//' backend/nvidia/SHA256SUMS.txt backend/opencl/SHA256SUMS.txt
          (cd backend/nvidia && sha256sum -c SHA256SUMS.txt)
          (cd backend/opencl && sha256sum -c SHA256SUMS.txt)
          test "$(sha256sum backend/nvidia/sudharma-gpupow-staging.exe | awk '{print $1}')" = "$(sha256sum backend/opencl/sudharma-gpupow-staging.exe | awk '{print $1}')"
      - name: Assemble v0.2.2 Windows package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/nvidia package/opencl
          cp -a backend/nvidia/. package/nvidia/
          cp -a backend/opencl/. package/opencl/
          cp scripts/windows/Run-GPU-Test.bat package/Run-GPU-Test.bat
          cp docs/test-mining/KHUSHI_HARDWARE_TEST_V0_2_2.txt package/README.txt
          cat > package/PACKAGE-METADATA.txt <<EOF
          package=Khushi Hardware Test v0.2.2
          protocol_id=sudharma-gpupow-v1
          source_revision=${GITHUB_SHA}
          staging_endpoint=http://127.0.0.1:28646
          localhost_only=true
          rehearsal_blocks=50
          production_consensus_cache_nodes=262144
          public_mainnet_launch=false
          public_mainnet_mining=false
          public_gpu_activation=disabled
          public_chain_submission=none
          formal_benchmark_seconds=60
          physical_evidence_gate=not_automatically_completed
          EOF
          (
            cd package
            find . -type f ! -name SHA256MANIFEST.txt -print0 | sort -z | xargs -0 sha256sum > SHA256MANIFEST.txt
          )
          (cd package && zip -q -r ../khushi-hardware-test-v0.2.2-windows.zip .)
          sha256sum khushi-hardware-test-v0.2.2-windows.zip > khushi-hardware-test-v0.2.2-windows.zip.sha256
          printf '%s\n' "$GITHUB_SHA" > SOURCE-REVISION.txt
          cat khushi-hardware-test-v0.2.2-windows.zip.sha256
      - name: Upload combined v0.2.2 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: khushi-hardware-test-v0.2.2-${{ github.sha }}
          path: |
            khushi-hardware-test-v0.2.2-windows.zip
            khushi-hardware-test-v0.2.2-windows.zip.sha256
            SOURCE-REVISION.txt
          if-no-files-found: error
          retention-days: 30
