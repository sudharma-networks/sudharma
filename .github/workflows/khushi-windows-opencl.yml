name: Khushi Windows OpenCL

on:
  push:
    branches:
      - feature/gpu-pow-v1
      - feature/gpu-autotune-profiles
    paths:
      - '.github/workflows/khushi-windows-opencl.yml'
      - '.github/workflows/khushi-windows-cuda.yml'
      - '.github/workflows/publish-test-mining-release.yml'
      - 'compatibility/opencl/**'
      - 'compatibility/cuda/**'
      - 'compatibility/gpu/**'
      - 'compatibility/gpupowv1/windows_opencl_artifact_contract_test.go'
      - 'compatibility/gpupowv1/windows_self_contained_staging_release_contract_test.go'
      - 'cmd/sudharma-gpupow-staging/**'
      - 'rpc/mining_staging*.go'
      - 'scripts/windows/test-khushi-miner.ps1'
      - 'scripts/windows/run-local-staging-gate.ps1'
      - 'docs/gpu-pow-v1-production-memory-vectors.json'
      - 'docs/test-mining/PUBLIC_TEST_MINING.md'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-opencl:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install OpenCL headers and loader import library
        shell: pwsh
        run: |
          vcpkg install opencl:x64-windows

      - name: Build generic Khushi OpenCL miner and production vector gate
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl.exe
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /EHsc /DCL_TARGET_OPENCL_VERSION=120 /I"C:\vcpkg\installed\x64-windows\include" compatibility\opencl\khushi_miner_opencl.cpp /link /LIBPATH:"C:\vcpkg\installed\x64-windows\lib" OpenCL.lib /OUT:dist\khushi-miner-opencl.exe
          cl /nologo /std:c++17 /O2 /EHsc /DCL_TARGET_OPENCL_VERSION=120 /I"C:\vcpkg\installed\x64-windows\include" compatibility\opencl\khushi_production_vectors_opencl.cpp /link /LIBPATH:"C:\vcpkg\installed\x64-windows\lib" OpenCL.lib /OUT:dist\khushi-production-vectors-opencl.exe
          copy /Y compatibility\opencl\khushi_pow.cl dist\khushi_pow.cl
          copy /Y compatibility\opencl\gpupow_v1_production_vectors.cl dist\gpupow_v1_production_vectors.cl
          copy /Y docs\gpu-pow-v1-production-memory-vectors.json dist\gpu-pow-v1-production-memory-vectors.json

      - name: Build same-revision local staging verifier
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o dist/sudharma-gpupow-staging.exe ./cmd/sudharma-gpupow-staging

      - name: Record provenance and checksums
        shell: pwsh
        run: |
          @(
            "algorithm=Khushi Algorithm",
            "protocol_id=sudharma-gpupow-v1",
            "source_revision=$env:GITHUB_SHA",
            "backend=OpenCL 1.2",
            "artifact=khushi-miner-opencl.exe",
            "production_vector_artifact=khushi-production-vectors-opencl.exe",
            "staging_verifier_artifact=sudharma-gpupow-staging.exe",
            "staging_endpoint_default=127.0.0.1:28646",
            "staging_consensus_activation=disabled",
            "staging_block_creation=none",
            "kernel=khushi_pow.cl",
            "production_vector_kernel=gpupow_v1_production_vectors.cl",
            "production_vectors=docs/gpu-pow-v1-production-memory-vectors.json",
            "gpu_policy=GPU devices only; CPU fallback prohibited"
          ) | Set-Content -Encoding ascii dist/build-metadata.txt
          $miner = Get-FileHash -Algorithm SHA256 dist/khushi-miner-opencl.exe
          $vectors = Get-FileHash -Algorithm SHA256 dist/khushi-production-vectors-opencl.exe
          $verifier = Get-FileHash -Algorithm SHA256 dist/sudharma-gpupow-staging.exe
          $kernel = Get-FileHash -Algorithm SHA256 dist/khushi_pow.cl
          $vectorKernel = Get-FileHash -Algorithm SHA256 dist/gpupow_v1_production_vectors.cl
          $fixture = Get-FileHash -Algorithm SHA256 dist/gpu-pow-v1-production-memory-vectors.json
          @(
            "$($miner.Hash.ToLower())  khushi-miner-opencl.exe",
            "$($vectors.Hash.ToLower())  khushi-production-vectors-opencl.exe",
            "$($verifier.Hash.ToLower())  sudharma-gpupow-staging.exe",
            "$($kernel.Hash.ToLower())  khushi_pow.cl",
            "$($vectorKernel.Hash.ToLower())  gpupow_v1_production_vectors.cl",
            "$($fixture.Hash.ToLower())  gpu-pow-v1-production-memory-vectors.json"
          ) | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Package Windows hardware and local staging runners
        shell: pwsh
        run: |
          Copy-Item scripts/windows/test-khushi-miner.ps1 dist/test-khushi-miner.ps1
          Copy-Item scripts/windows/run-local-staging-gate.ps1 dist/run-local-staging-gate.ps1

      - name: Upload generic Windows OpenCL artifact
        uses: actions/upload-artifact@v4
        with:
          name: khushi-miner-opencl-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
