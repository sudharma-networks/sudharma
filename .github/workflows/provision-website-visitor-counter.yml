name: Provision Website Visitor Counter

on:
  push:
    branches:
      - feature/website-foundation
    paths:
      - 'deployment/website/visitor-counter/**'
      - '.github/workflows/provision-website-visitor-counter.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: website-visitor-counter
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: feature/website-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify visitor counter contracts
        run: node --test deployment/website/visitor-counter/*.test.mjs

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Provision persistent visitor counter
        id: provision
        shell: bash
        run: bash deployment/website/visitor-counter/provision.sh

      - name: Verify public counter endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(jq -r '.endpoint' web/public/data/visitor-counter.json)"
          test -n "$endpoint"
          test "$endpoint" != 'null'
          curl -fsS --max-time 10 "$endpoint" | jq -e '.total | numbers' >/dev/null

      - name: Publish public endpoint config to website branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f web/public/data/visitor-counter.json
          if git diff --cached --quiet; then
            echo 'Visitor counter endpoint config already current.'
            exit 0
          fi
          git commit -m 'chore(web): publish visitor counter endpoint'
          git push origin HEAD:feature/website-foundation
