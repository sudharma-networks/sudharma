name: Provision Website Visitor Counter

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Repository variable should contain the ARN for the existing
          # Sudharma-GitHub-Actions-Testnet OIDC role.
          role-to-assume: ${{ vars.SUDHARMA_AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Provision visitor counter
        id: provision
        run: bash deployment/website/visitor-counter/provision.sh

      - name: Record visitor counter endpoint
        run: |
          echo "Visitor counter endpoint: ${{ steps.provision.outputs.endpoint }}"

      - name: Commit public endpoint config
        run: |
          if git diff --quiet -- web/public/data/visitor-counter.json; then
            echo "Visitor counter public config is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/data/visitor-counter.json
          git commit -m "chore(web): update public visitor counter endpoint"
          git push
