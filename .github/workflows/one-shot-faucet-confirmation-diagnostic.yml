name: One-shot Faucet Confirmation Diagnostic

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/one-shot-faucet-confirmation-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
    steps:
      - name: Derive public disposable diagnostic address
        id: address
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { createECDH, createHash } = require('node:crypto');
          let scalar = createHash('sha256').update(`sudharma-faucet-diagnostic:${process.env.GITHUB_SHA}`).digest();
          // A random-looking SHA-256 scalar is overwhelmingly likely to be in the P-256 range.
          const ecdh = createECDH('prime256v1');
          try {
            ecdh.setPrivateKey(scalar);
          } catch {
            scalar = createHash('sha256').update(Buffer.concat([scalar, Buffer.from([1])])).digest();
            ecdh.setPrivateKey(scalar);
          }
          const publicKey = ecdh.getPublicKey(undefined, 'uncompressed');
          const address = createHash('sha256').update(publicKey).digest().subarray(0, 20).toString('hex');
          console.log(`address=${address}`);
          NODE

      - name: Verify faucet public info
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "$RPC_BASE_URL/v1/faucet/info" | tee faucet-info.json
          jq -e '.enabled == true and .initial_grant_sudh == 100 and .challenge_send_sudh == 25 and .challenge_reward_sudh == 50 and .testnet_only == true' faucet-info.json >/dev/null

      - name: Request initial 100 SUDH grant
        id: request
        shell: bash
        env:
          ADDRESS: ${{ steps.address.outputs.address }}
        run: |
          set -euo pipefail
          printf 'diagnostic_address=%s\n' "$ADDRESS"
          response="$(curl -fsS --max-time 15 -H 'content-type: application/json' -d "{\"address\":\"${ADDRESS}\"}" "$RPC_BASE_URL/v1/faucet/request")"
          printf '%s\n' "$response" | tee faucet-request.json
          txid="$(printf '%s' "$response" | jq -r '.transaction_id')"
          status="$(printf '%s' "$response" | jq -r '.status')"
          [[ "$txid" =~ ^[0-9a-f]{64}$ ]]
          [[ "$status" == 'submitted' || "$status" == 'confirmed' ]]
          echo "txid=$txid" >> "$GITHUB_OUTPUT"

      - name: Poll payout transaction and mempool
        shell: bash
        env:
          TXID: ${{ steps.request.outputs.txid }}
        run: |
          set -euo pipefail
          confirmed=false
          for attempt in $(seq 1 30); do
            status_json="$(curl -fsS --max-time 10 "$RPC_BASE_URL/v1/status")"
            tx_json="$(curl -fsS --max-time 10 "$RPC_BASE_URL/v1/transactions/$TXID")"
            mempool="$(printf '%s' "$status_json" | jq -r '.mempool // -1')"
            tx_status="$(printf '%s' "$tx_json" | jq -r '.status // "unknown"')"
            confirmations="$(printf '%s' "$tx_json" | jq -r '.confirmations // 0')"
            height="$(printf '%s' "$status_json" | jq -r '.height // -1')"
            printf 'attempt=%s height=%s mempool=%s tx_status=%s confirmations=%s\n' "$attempt" "$height" "$mempool" "$tx_status" "$confirmations"
            if [[ "$tx_status" == 'confirmed' && "$confirmations" -ge 1 ]]; then
              confirmed=true
              break
            fi
            sleep 5
          done
          if [[ "$confirmed" != true ]]; then
            echo 'DIAGNOSTIC: faucet payout was accepted but did not confirm within 150 seconds.' >&2
            exit 1
          fi
          echo 'DIAGNOSTIC: faucet payout confirmed on public testnet.'
