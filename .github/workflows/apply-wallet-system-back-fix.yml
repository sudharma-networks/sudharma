name: Apply Wallet System Back Fix

on:
  push:
    branches: [cursor/wallet-txn-details-83d4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/wallet-txn-details-83d4

      - name: Patch WalletApp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/src/main/java/network/sudharma/wallet/WalletApp.kt')
          s = p.read_text()
          a = 'import androidx.activity.compose.rememberLauncherForActivityResult\n'
          if 'import androidx.activity.compose.BackHandler\n' not in s:
              assert a in s
              s = s.replace(a, 'import androidx.activity.compose.BackHandler\n' + a, 1)
          a = '    when (screen) {'
          b = '    BackHandler(enabled = SystemBackNavigation.intercepts(screen)) {\n        screen = SystemBackNavigation.previous(screen)\n    }\n\n    when (screen) {'
          if 'BackHandler(enabled = SystemBackNavigation.intercepts(screen))' not in s:
              assert a in s
              s = s.replace(a, b, 1)
          a = '    selected?.let { item ->'
          b = '    BackHandler(enabled = selected != null) {\n        selected = null\n    }\n\n    selected?.let { item ->'
          if 'BackHandler(enabled = selected != null)' not in s:
              assert a in s
              s = s.replace(a, b, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/android/app/src/main/java/network/sudharma/wallet/WalletApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix(android): honor system back navigation'
          git push origin cursor/wallet-txn-details-83d4
