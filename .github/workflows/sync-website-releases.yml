name: Sync Website Release Metadata

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/website-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - run: npm install
      - run: npm run sync:github

      - name: Commit synced release metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github-releases.json public/data/project-status.json
          if git diff --cached --quiet; then
            echo "Release metadata already current."
            exit 0
          fi
          git commit -m "chore(web): sync verified GitHub release metadata"
          git push origin feature/website-foundation
