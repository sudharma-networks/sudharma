name: Sync Website Releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-website-releases.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  release:
    types: [published, released, prereleased]

permissions:
  contents: write

concurrency:
  group: website-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: feature/website-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install website dependencies
        run: npm --prefix web install

      - name: Verify release classifier
        run: npm --prefix web test -- github-release-sync.test.ts

      - name: Generate public GitHub snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm --prefix web run sync:github

      - name: Validate generated snapshots
        run: |
          node -e "JSON.parse(require('fs').readFileSync('web/public/data/github-releases.json','utf8')); JSON.parse(require('fs').readFileSync('web/public/data/project-status.json','utf8'));"

      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- web/public/data/github-releases.json web/public/data/project-status.json; then
            echo "Public GitHub snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/data/github-releases.json web/public/data/project-status.json
          git commit -m "chore(web): sync public GitHub releases"
          git push origin HEAD:feature/website-foundation
