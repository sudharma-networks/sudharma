name: Faucet Live Diagnostics

on:
  push:
    branches:
      - feature/faucet-recovery-stage2
    paths:
      - .github/workflows/faucet-live-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  LAMBDA_NAME: Sudharma-Testnet-Wallet-Proxy
  FAUCET_TABLE_NAME: Sudharma-Testnet-Faucet
  FAILED_ADDRESS: 16d7dc9ec0495109007860a584c7cf9055da9abf

jobs:
  safe-live-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Confirm read-only diagnostic identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          aws lambda get-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus,FaucetEnabled:Environment.Variables.FAUCET_ENABLED}' \
            --output json

      - name: Read failed-address state safely
        run: |
          set -u
          key="{\"pk\":{\"S\":\"ADDR#$FAILED_ADDRESS\"}}"
          if aws dynamodb get-item \
            --table-name "$FAUCET_TABLE_NAME" \
            --key "$key" \
            --consistent-read \
            --projection-expression 'initial_status, initial_txid, initial_error, initial_reserved_at, initial_prepared_at, initial_submitted_at, initial_paid_at' \
            --query 'Item.{initial_status:initial_status.S,initial_txid:initial_txid.S,initial_error:initial_error.S,initial_reserved_at:initial_reserved_at.N,initial_prepared_at:initial_prepared_at.N,initial_submitted_at:initial_submitted_at.N,initial_paid_at:initial_paid_at.N}' \
            --output json; then
            echo '{"dynamodb_get_item":"OK"}'
          else
            echo '{"dynamodb_get_item":"DENIED_OR_FAILED"}'
          fi

      - name: Read recent safe faucet dependency logs
        run: |
          set -u
          start_ms="$(date -u -d '8 hours ago' +%s%3N)"
          log_group="/aws/lambda/$LAMBDA_NAME"
          for pattern in '"faucet_dependency"' '"wallet_faucet_error"'; do
            echo "=== filter $pattern ==="
            if aws logs filter-log-events \
              --log-group-name "$log_group" \
              --start-time "$start_ms" \
              --filter-pattern "$pattern" \
              --max-items 100 \
              --query 'events[].message' \
              --output text; then
              echo '{"cloudwatch_filter":"OK"}'
            else
              echo '{"cloudwatch_filter":"DENIED_OR_FAILED"}'
            fi
          done
