name: Faucet Recovery Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - feature/faucet-recovery-stage2
    paths:
      - .github/workflows/faucet-recovery-monitor.yml
      - scripts/faucet-recovery-monitor.mjs

permissions:
  contents: read

env:
  RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Monitor mempool readiness
        id: monitor
        run: |
          set -euo pipefail
          node ./scripts/faucet-recovery-monitor.mjs | tee /tmp/faucet-monitor.json

      - name: Report recovery still blocked
        if: failure() && steps.monitor.outcome == 'failure'
        run: |
          set -euo pipefail
          cat /tmp/faucet-monitor.json
          node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/faucet-monitor.json', 'utf8'));
            const actions = payload.snapshot?.operator_actions ?? [];
            if (actions.length === 0) process.exit(0);
            console.log('Operator actions required:');
            for (const action of actions) console.log('- ' + action);
            process.exit(1);
          "
