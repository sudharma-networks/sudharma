name: GPU-PoW v1 OpenCL CI

on:
  push:
    branches:
      - feature/gpu-pow-v1
    paths:
      - 'compatibility/opencl/**'
      - 'scripts/test-gpupow-opencl.sh'
      - '.github/workflows/gpu-pow-v1-opencl-ci.yml'

permissions:
  contents: read

jobs:
  opencl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CPU OpenCL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ocl-icd-opencl-dev \
            pocl-opencl-icd \
            pkg-config

      - name: Run OpenCL compatibility gate
        run: bash scripts/test-gpupow-opencl.sh
