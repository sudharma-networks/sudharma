name: Apply Wallet Activity History Split

on:
  push:
    branches: [cursor/wallet-txn-details-83d4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/wallet-txn-details-83d4

      - name: Patch wallet split
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rp = Path('mobile/android/app/src/main/java/network/sudharma/wallet/SudharmaWalletRepository.kt')
          r = rp.read_text()
          a = '    suspend fun balance(): AssetBalance = adapter().balance(account().address)\n\n'
          if 'suspend fun serverStatus()' not in r:
              assert a in r
              r = r.replace(a, a + '    suspend fun serverStatus(): SudharmaRpcClient.Status = rpcClient().status()\n\n', 1)
          rp.write_text(r)

          p = Path('mobile/android/app/src/main/java/network/sudharma/wallet/WalletApp.kt')
          s = p.read_text()

          a = 'import network.sudharma.wallet.chain.sudharma.SudharmaPaymentUri\n'
          if 'import network.sudharma.wallet.chain.sudharma.SudharmaRpcClient\n' not in s:
              assert a in s
              s = s.replace(a, a + 'import network.sudharma.wallet.chain.sudharma.SudharmaRpcClient\n', 1)

          a = '            onActivity = { screen = WalletScreen.ACTIVITY },\n            onSettings = { screen = WalletScreen.SETTINGS },'
          if 'onHistory = { screen = WalletScreen.HISTORY }' not in s:
              assert a in s
              s = s.replace(a, '            onActivity = { screen = WalletScreen.ACTIVITY },\n            onHistory = { screen = WalletScreen.HISTORY },\n            onSettings = { screen = WalletScreen.SETTINGS },', 1)

          a = '        WalletScreen.ACTIVITY -> ActivityScreen(repository, onBack = { screen = WalletScreen.HOME })\n'
          if 'WalletScreen.HISTORY -> TransactionHistoryScreen' not in s:
              assert a in s
              s = s.replace(a, '        WalletScreen.ACTIVITY -> ServerActivityScreen(repository, onBack = { screen = WalletScreen.HOME })\n        WalletScreen.HISTORY -> TransactionHistoryScreen(repository, onBack = { screen = WalletScreen.HOME })\n', 1)

          a = '    onActivity: () -> Unit,\n    onSettings: () -> Unit,\n) {'
          if '    onHistory: () -> Unit,' not in s:
              assert a in s
              s = s.replace(a, '    onActivity: () -> Unit,\n    onHistory: () -> Unit,\n    onSettings: () -> Unit,\n) {', 1)

          s = s.replace('Text("Recent activity", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)', 'Text("Recent history", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)', 1)
          s = s.replace('TextButton(onClick = onActivity) { Text("View all activity") }', 'TextButton(onClick = onHistory) { Text("View all history") }', 1)

          a = '            TextButton(onClick = onActivity) { Text("Activity") }\n            TextButton(onClick = onSettings) { Text("Settings") }'
          if 'TextButton(onClick = onHistory) { Text("History") }' not in s:
              assert a in s
              s = s.replace(a, '            TextButton(onClick = onActivity) { Text("Activity") }\n            TextButton(onClick = onHistory) { Text("History") }\n            TextButton(onClick = onSettings) { Text("Settings") }', 1)

          a = '@Composable\nprivate fun ActivityScreen(repository: SudharmaWalletRepository, onBack: () -> Unit) {'
          if 'private fun TransactionHistoryScreen' not in s:
              assert a in s
              s = s.replace(a, '@Composable\nprivate fun TransactionHistoryScreen(repository: SudharmaWalletRepository, onBack: () -> Unit) {', 1)

          server = '''@Composable
private fun ServerActivityScreen(repository: SudharmaWalletRepository, onBack: () -> Unit) {
    val scope = rememberCoroutineScope()
    var server by remember { mutableStateOf<SudharmaRpcClient.Status?>(null) }
    var connection by remember { mutableStateOf(if (repository.preferences.rpcUrl.isBlank()) "RPC not configured" else "Checking…") }
    var serverLog by remember { mutableStateOf("No server check has completed yet.") }
    var lastRefreshMs by remember { mutableStateOf<Long?>(null) }

    fun refresh() {
        if (repository.preferences.rpcUrl.isBlank()) {
            server = null
            connection = "RPC not configured"
            serverLog = "No RPC endpoint is configured for this wallet."
            lastRefreshMs = System.currentTimeMillis()
            return
        }
        connection = "Checking…"
        scope.launch {
            runCatching { repository.serverStatus() }
                .onSuccess {
                    server = it
                    connection = "Connected"
                    serverLog = "Connected to ${it.network} RPC. Height ${it.height}, ${it.peers} peer(s), ${it.mempool} transaction(s) in mempool."
                    lastRefreshMs = System.currentTimeMillis()
                }
                .onFailure {
                    server = null
                    connection = "Offline / unavailable"
                    serverLog = it.message ?: "Unable to read server status"
                    lastRefreshMs = System.currentTimeMillis()
                }
        }
    }

    LaunchedEffect(repository.preferences.rpcUrl) { refresh() }

    ScreenFrame("Activity", onBack) {
        TestnetBadge()
        Text("Server & network activity", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
        Text("Live connection details for the Sudharma Testnet RPC used by this wallet.", style = MaterialTheme.typography.bodySmall)
        OutlinedButton(onClick = { refresh() }) { Text("Refresh server status") }
        DetailRow(label = "Connection", value = connection)
        DetailRow(label = "RPC endpoint", value = repository.preferences.rpcUrl.ifBlank { "Not configured" })
        server?.let {
            DetailRow(label = "Network", value = "${it.network} (${it.symbol})")
            DetailRow(label = "Chain height", value = it.height.toString())
            DetailRow(label = "Peers", value = it.peers.toString())
            DetailRow(label = "Mempool", value = it.mempool.toString())
            DetailRow(label = "Tip hash", value = it.tipHash.ifBlank { "—" })
            DetailRow(label = "Issued supply", value = "${formatAtomic(it.issuedSupply)} SUDH")
        }
        lastRefreshMs?.let { DetailRow(label = "Last refresh", value = TransactionDetailFormatter.timestampLabel(it)) }
        HorizontalDivider()
        Text("Server log", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)
        Card(Modifier.fillMaxWidth()) {
            Text(serverLog, modifier = Modifier.padding(14.dp), style = MaterialTheme.typography.bodySmall)
        }
    }
}

'''
          a = '@Composable\nprivate fun TransactionHistoryScreen(repository: SudharmaWalletRepository, onBack: () -> Unit) {'
          if 'private fun ServerActivityScreen' not in s:
              assert a in s
              s = s.replace(a, server + a, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/android/app/src/main/java/network/sudharma/wallet/SudharmaWalletRepository.kt mobile/android/app/src/main/java/network/sudharma/wallet/WalletApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat(android): split server activity from transaction history'
          git push origin cursor/wallet-txn-details-83d4
