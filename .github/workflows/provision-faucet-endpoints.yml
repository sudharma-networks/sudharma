name: Provision Faucet VPC Endpoints

on:
  push:
    branches:
      - feature/public-testnet-wallet-v2
    paths:
      - '.github/workflows/provision-faucet-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VPC_ID: vpc-0cd862d72cf8165fa
      LAMBDA_SG_ID: sg-057c9893359ab2300
      SUBNET_1: subnet-0c04f19843bf6a401
      SUBNET_2: subnet-0f213d036a08fd543
      ROUTE_TABLE_ID: rtb-01b677867c34cc275
    steps:
      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Allow private HTTPS within Lambda security group
        shell: bash
        run: |
          set -euo pipefail
          sg="$(aws ec2 describe-security-groups --group-ids "$LAMBDA_SG_ID" --output json)"
          if ! printf '%s' "$sg" | jq -e --arg sg "$LAMBDA_SG_ID" \
            '.SecurityGroups[0].IpPermissions[]? | select(.IpProtocol=="tcp" and .FromPort==443 and .ToPort==443) | .UserIdGroupPairs[]? | select(.GroupId==$sg)' >/dev/null; then
            aws ec2 authorize-security-group-ingress \
              --group-id "$LAMBDA_SG_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=443,ToPort=443,UserIdGroupPairs=[{GroupId=${LAMBDA_SG_ID},Description='HTTPS from Sudharma Lambda to its private AWS endpoints'}]"
          fi

          sg="$(aws ec2 describe-security-groups --group-ids "$LAMBDA_SG_ID" --output json)"
          if ! printf '%s' "$sg" | jq -e --arg sg "$LAMBDA_SG_ID" \
            '.SecurityGroups[0].IpPermissionsEgress[]? | select(.IpProtocol=="tcp" and .FromPort==443 and .ToPort==443) | .UserIdGroupPairs[]? | select(.GroupId==$sg)' >/dev/null; then
            aws ec2 authorize-security-group-egress \
              --group-id "$LAMBDA_SG_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=443,ToPort=443,UserIdGroupPairs=[{GroupId=${LAMBDA_SG_ID},Description='HTTPS to Sudharma private AWS endpoints'}]"
          fi

      - name: Create or reuse Secrets Manager interface endpoint
        id: secrets_endpoint
        shell: bash
        run: |
          set -euo pipefail
          SERVICE='com.amazonaws.ap-south-1.secretsmanager'
          VPCE_ID="$(aws ec2 describe-vpc-endpoints \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=service-name,Values=${SERVICE}" \
            --query 'VpcEndpoints[?State!=`deleted`] | [0].VpcEndpointId' --output text)"
          if [ "$VPCE_ID" = 'None' ] || [ -z "$VPCE_ID" ]; then
            VPCE_ID="$(aws ec2 create-vpc-endpoint \
              --vpc-id "$VPC_ID" \
              --vpc-endpoint-type Interface \
              --service-name "$SERVICE" \
              --subnet-ids "$SUBNET_1" "$SUBNET_2" \
              --security-group-ids "$LAMBDA_SG_ID" \
              --private-dns-enabled \
              --query 'VpcEndpoint.VpcEndpointId' --output text)"
          fi
          echo "vpce_id=${VPCE_ID}" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 40); do
            state="$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids "$VPCE_ID" --query 'VpcEndpoints[0].State' --output text)"
            echo "Secrets Manager endpoint ${VPCE_ID} state: ${state}"
            [ "$state" = 'available' ] && break
            if [ "$state" = 'failed' ] || [ "$state" = 'rejected' ] || [ "$state" = 'deleted' ]; then
              exit 1
            fi
            sleep 5
          done
          [ "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids "$VPCE_ID" --query 'VpcEndpoints[0].State' --output text)" = 'available' ]

      - name: Create or reuse DynamoDB gateway endpoint
        id: dynamodb_endpoint
        shell: bash
        run: |
          set -euo pipefail
          SERVICE='com.amazonaws.ap-south-1.dynamodb'
          VPCE_ID="$(aws ec2 describe-vpc-endpoints \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=service-name,Values=${SERVICE}" \
            --query 'VpcEndpoints[?State!=`deleted`] | [0].VpcEndpointId' --output text)"
          if [ "$VPCE_ID" = 'None' ] || [ -z "$VPCE_ID" ]; then
            VPCE_ID="$(aws ec2 create-vpc-endpoint \
              --vpc-id "$VPC_ID" \
              --vpc-endpoint-type Gateway \
              --service-name "$SERVICE" \
              --route-table-ids "$ROUTE_TABLE_ID" \
              --query 'VpcEndpoint.VpcEndpointId' --output text)"
          fi
          echo "vpce_id=${VPCE_ID}" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 40); do
            state="$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids "$VPCE_ID" --query 'VpcEndpoints[0].State' --output text)"
            echo "DynamoDB endpoint ${VPCE_ID} state: ${state}"
            [ "$state" = 'available' ] && break
            if [ "$state" = 'failed' ] || [ "$state" = 'rejected' ] || [ "$state" = 'deleted' ]; then
              exit 1
            fi
            sleep 5
          done
          [ "$(aws ec2 describe-vpc-endpoints --vpc-endpoint-ids "$VPCE_ID" --query 'VpcEndpoints[0].State' --output text)" = 'available' ]

      - name: Verify endpoint state and restricted Lambda egress
        shell: bash
        run: |
          set -euo pipefail
          aws ec2 describe-vpc-endpoints \
            --vpc-endpoint-ids '${{ steps.secrets_endpoint.outputs.vpce_id }}' '${{ steps.dynamodb_endpoint.outputs.vpce_id }}' \
            --query 'VpcEndpoints[].{Id:VpcEndpointId,Service:ServiceName,Type:VpcEndpointType,State:State,PrivateDns:PrivateDnsEnabled,Subnets:SubnetIds,RouteTables:RouteTableIds,SecurityGroups:Groups[].GroupId}' \
            --output json
          aws ec2 describe-security-groups \
            --group-ids "$LAMBDA_SG_ID" \
            --query 'SecurityGroups[].{GroupId:GroupId,Ingress:IpPermissions,Egress:IpPermissionsEgress}' \
            --output json
