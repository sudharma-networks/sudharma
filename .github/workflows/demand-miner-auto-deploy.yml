name: Demand Miner Auto Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
  AWS_REGION: ap-south-1
  SUDHARMA_REPO_REF: feature/faucet-recovery-stage2
  TESTNET_DEMAND_MINER_BUCKET: ${{ vars.TESTNET_DEMAND_MINER_BUCKET }}

jobs:
  assess-chain-work:
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      should_attempt_recovery: ${{ steps.gate.outputs.should_attempt_recovery }}
      network_mempool: ${{ steps.gate.outputs.network_mempool }}
      network_height: ${{ steps.gate.outputs.network_height }}
      chain_advancement_required: ${{ steps.gate.outputs.chain_advancement_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assess mempool and recovery blockers
        id: gate
        run: |
          set -euo pipefail
          node ./scripts/faucet-recovery-monitor.mjs | tee /tmp/demand-miner-assess.json || true
          should_deploy="$(node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/demand-miner-assess.json', 'utf8'));
            const eventName = process.env.GITHUB_EVENT_NAME;
            const scheduled = eventName === 'schedule';
            const pushed = eventName === 'push';
            const faucetNeedsFunding = payload.readiness?.faucet_needs_funding === true;
            const blocked = payload.readiness?.should_attempt_recovery === false
              && payload.readiness?.chain_advancement_required === true;
            const pending = Number(payload.snapshot?.mempool ?? 0) > 0;
            process.stdout.write(scheduled || pushed || blocked || pending || faucetNeedsFunding ? 'true' : 'false');
          ")"
          network_mempool="$(node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/demand-miner-assess.json', 'utf8'));
            process.stdout.write(String(payload.snapshot?.mempool ?? ''));
          ")"
          network_height="$(node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/demand-miner-assess.json', 'utf8'));
            process.stdout.write(String(payload.snapshot?.height ?? ''));
          ")"
          chain_advancement_required="$(node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/demand-miner-assess.json', 'utf8'));
            process.stdout.write(payload.snapshot?.chain_advancement_required === true ? 'true' : 'false');
          ")"
          should_attempt_recovery="$(node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/demand-miner-assess.json', 'utf8'));
            process.stdout.write(payload.readiness?.should_attempt_recovery === true ? 'true' : 'false');
          ")"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "should_attempt_recovery=$should_attempt_recovery" >> "$GITHUB_OUTPUT"
          echo "network_mempool=$network_mempool" >> "$GITHUB_OUTPUT"
          echo "network_height=$network_height" >> "$GITHUB_OUTPUT"
          echo "chain_advancement_required=$chain_advancement_required" >> "$GITHUB_OUTPUT"
          cat /tmp/demand-miner-assess.json
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Skip when chain does not need demand mining
        if: steps.gate.outputs.should_deploy != 'true'
        run: |
          echo '{"demand_miner_auto_deploy_skipped":"chain_work_not_pending"}'
          echo "Height=${{ steps.gate.outputs.network_height }} mempool=${{ steps.gate.outputs.network_mempool }}"

  publish-binaries:
    needs: assess-chain-work
    if: needs.assess-chain-work.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    outputs:
      demand_url: ${{ steps.publish.outputs.demand_url }}
      node_url: ${{ steps.publish.outputs.node_url }}
      publish_success: ${{ steps.publish.outcome == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and publish demand miner binaries to S3
        id: publish
        continue-on-error: true
        run: |
          set -euo pipefail
          bucket="${TESTNET_DEMAND_MINER_BUCKET:-sudharma-testnet-demand-miner-981626123397}"
          export TESTNET_DEMAND_MINER_BUCKET="$bucket"
          ./scripts/publish-demand-miner-binaries.sh | tee /tmp/published-binaries.json
          echo "demand_url=$(jq -r .demand_miner_bin_url /tmp/published-binaries.json)" >> "$GITHUB_OUTPUT"
          echo "node_url=$(jq -r .sudharmad_bin_url /tmp/published-binaries.json)" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

  ensure-on-seeds:
    needs: [assess-chain-work, publish-binaries]
    if: needs.assess-chain-work.outputs.should_deploy == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed_name: seed1
            seed_private_ip: 172.31.10.171
            seed_config: deployment/testnet/demand-miner.seed1-live.example.json
            seed_instance_id: ${{ vars.TESTNET_SEED1_INSTANCE_ID }}
            seed_fallback_instance_id: i-06e7ddb174e4941de
          - seed_name: seed2
            seed_private_ip: 172.31.32.195
            seed_config: deployment/testnet/demand-miner.seed2-live.example.json
            seed_instance_id: ${{ vars.TESTNET_SEED2_INSTANCE_ID }}
            seed_fallback_instance_id: ''
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Resolve seed instance id
        id: seed
        run: |
          set -euo pipefail
          instance_id="$(bash deployment/testnet/resolve-seed-instance-id.sh \
            "${{ matrix.seed_private_ip }}" \
            "${{ matrix.seed_instance_id }}" \
            "${{ matrix.seed_fallback_instance_id }}" 2>/dev/null || true)"
          if [ -z "$instance_id" ]; then
            echo "seed_instance_found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Demand miner auto-deploy::No ${{ matrix.seed_name }} instance id configured or discoverable via SSM (${{ matrix.seed_private_ip }}). Set repository variable TESTNET_${{ matrix.seed_name == 'seed1' && 'SEED1' || 'SEED2' }}_INSTANCE_ID."
            exit 0
          fi
          echo "seed_instance_found=true" >> "$GITHUB_OUTPUT"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          printf '{"seed":"%s","seed_instance_id":"%s","seed_private_ip":"%s"}\n' \
            "${{ matrix.seed_name }}" "$instance_id" "${{ matrix.seed_private_ip }}"

      - name: Ensure demand miner via SSM (S3 prebuilt)
        if: steps.seed.outputs.seed_instance_found == 'true' && needs.publish-binaries.outputs.publish_success == 'true'
        run: |
          set -euo pipefail
          config_b64="$(base64 -w0 "${{ matrix.seed_config }}")"
          install_b64="$(base64 -w0 deployment/testnet/remote-install-demand-miner-from-urls.sh)"
          demand_url="${{ needs.publish-binaries.outputs.demand_url }}"
          node_url="${{ needs.publish-binaries.outputs.node_url }}"
          config_example="${{ matrix.seed_config }}"

          remote_script_file="$(mktemp)"
          {
            echo 'set -euo pipefail'
            printf 'export DEMAND_MINER_BIN_URL=%q\n' "$demand_url"
            printf 'export SUDHARMAD_BIN_URL=%q\n' "$node_url"
            printf 'export DEMAND_MINER_CONFIG_B64=%q\n' "$config_b64"
            printf 'export SUDHARMA_DEMAND_MINER_CONFIG=%q\n' "$config_example"
            printf 'export SUDHARMA_REPO_REF=%q\n' "$SUDHARMA_REPO_REF"
            printf 'echo %q | base64 -d > /tmp/remote-install-demand-miner-from-urls.sh\n' "$install_b64"
            echo 'chmod +x /tmp/remote-install-demand-miner-from-urls.sh'
            echo 'bash /tmp/remote-install-demand-miner-from-urls.sh'
            echo 'rm -f /tmp/remote-install-demand-miner-from-urls.sh'
          } > "$remote_script_file"
          bash deployment/testnet/ssm-send-remote-script.sh \
            "${{ steps.seed.outputs.instance_id }}" \
            "Install Sudharma demand miner on ${{ matrix.seed_name }} from prebuilt S3 binaries" \
            "$remote_script_file" \
            "demand_miner_install"
          rm -f "$remote_script_file"

      - name: Ensure demand miner via SSM (on-seed build fallback)
        if: steps.seed.outputs.seed_instance_found == 'true' && needs.publish-binaries.outputs.publish_success != 'true'
        run: |
          set -euo pipefail
          echo '::warning title=S3 prebuilt publish unavailable::Falling back to on-seed build with apt-installed Go on ${{ matrix.seed_name }}.'
          ensure_b64="$(base64 -w0 deployment/testnet/remote-ensure-demand-miner.sh)"
          config_example="${{ matrix.seed_config }}"
          remote_script_file="$(mktemp)"
          {
            echo 'set -euo pipefail'
            printf 'export SUDHARMA_REPO_REF=%q\n' "$SUDHARMA_REPO_REF"
            printf 'export SUDHARMA_DEMAND_MINER_CONFIG=%q\n' "$config_example"
            printf 'echo %q | base64 -d > /tmp/remote-ensure-demand-miner.sh\n' "$ensure_b64"
            echo 'chmod +x /tmp/remote-ensure-demand-miner.sh'
            echo 'bash /tmp/remote-ensure-demand-miner.sh'
            echo 'rm -f /tmp/remote-ensure-demand-miner.sh'
          } > "$remote_script_file"
          bash deployment/testnet/ssm-send-remote-script.sh \
            "${{ steps.seed.outputs.instance_id }}" \
            "Ensure Sudharma demand miner on ${{ matrix.seed_name }} via on-seed build" \
            "$remote_script_file" \
            "demand_miner_ensure"
          rm -f "$remote_script_file"

      - name: Report missing seed target
        if: steps.seed.outputs.seed_instance_found != 'true'
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ] || [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "::warning title=Skipping ${{ matrix.seed_name }}::Instance id not configured for ${{ matrix.seed_private_ip }}"
          fi

  verify-chain-progress:
    needs: [assess-chain-work, ensure-on-seeds]
    if: >-
      always() &&
      needs.assess-chain-work.outputs.should_deploy == 'true' &&
      needs.ensure-on-seeds.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify chain advanced after ensure
        run: |
          set -euo pipefail
          sleep 20
          status_body="$(curl -fsS "$RPC_BASE_URL/v1/status")"
          printf '%s\n' "$status_body"
          BODY="$status_body" BEFORE_HEIGHT="${{ needs.assess-chain-work.outputs.network_height }}" BEFORE_MEMPOOL="${{ needs.assess-chain-work.outputs.network_mempool }}" node --input-type=module -e "
            const beforeHeight = Number(process.env.BEFORE_HEIGHT || 0);
            const beforeMempool = Number(process.env.BEFORE_MEMPOOL || 0);
            const body = JSON.parse(process.env.BODY);
            const progressed = body.height > beforeHeight || body.mempool < beforeMempool;
            console.log(JSON.stringify({
              before: { height: beforeHeight, mempool: beforeMempool },
              after: { height: body.height, mempool: body.mempool },
              chain_progressed: progressed,
            }, null, 2));
            if (!progressed) process.exit(2);
          "
        continue-on-error: true
        env:
          RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com

      - name: Post-ensure public status snapshot
        if: always()
        run: |
          curl -fsS "$RPC_BASE_URL/v1/status" | tee /tmp/post-ensure-status.json
          curl -fsS "$RPC_BASE_URL/v1/faucet/diagnostics" | tee /tmp/post-ensure-diagnostics.json

  trigger-faucet-recovery:
    needs: [assess-chain-work, ensure-on-seeds]
    if: >-
      always() &&
      needs.assess-chain-work.result == 'success' &&
      needs.assess-chain-work.outputs.should_attempt_recovery == 'true' &&
      (
        (needs.assess-chain-work.outputs.should_deploy != 'true' && needs.ensure-on-seeds.result == 'skipped') ||
        (needs.assess-chain-work.outputs.should_deploy == 'true' && needs.ensure-on-seeds.result == 'success')
      )
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      LAMBDA_NAME: Sudharma-Testnet-Wallet-Proxy
      FAUCET_TABLE_NAME: Sudharma-Testnet-Faucet
      FAUCET_SECRET_ID: sudharma/testnet/faucet-wallet
      FAUCET_RECOVERY_ADDRESS: 16d7dc9ec0495109007860a584c7cf9055da9abf
      FAILED_ADDRESS: 16d7dc9ec0495109007860a584c7cf9055da9abf
      FAILED_TXID: b66bde192c92d192b47ca6e972911e4bfb310a0f343b6ef15b77c468d8a989cc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate recovery readiness after demand mining
        id: readiness
        run: |
          set -euo pipefail
          node ./scripts/evaluate-faucet-recovery-readiness.mjs | tee /tmp/recovery-after-miner.json || true
          should_attempt="$(node --input-type=module -e "
            const fs = await import('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/recovery-after-miner.json', 'utf8'));
            process.stdout.write(payload.readiness?.should_attempt_recovery === true ? 'true' : 'false');
          ")"
          echo "should_attempt=$should_attempt" >> "$GITHUB_OUTPUT"
          cat /tmp/recovery-after-miner.json

      - name: Configure AWS credentials from GitHub OIDC
        if: steps.readiness.outputs.should_attempt == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::981626123397:role/Sudharma-GitHub-Actions-Testnet
          aws-region: ap-south-1

      - name: Briefly enable faucet and resubmit prepared payout
        if: steps.readiness.outputs.should_attempt == 'true'
        id: recover
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --query 'Environment.Variables' \
            --output json > /tmp/lambda-environment-base.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = JSON.parse(fs.readFileSync('/tmp/lambda-environment-base.json', 'utf8')) ?? {};
          const common = {
            SEED_1_URL: 'http://172.31.10.171:29100',
            SEED_2_URL: 'http://172.31.32.195:29100',
            UPSTREAM_TIMEOUT_MS: '3500',
            FAUCET_TABLE_NAME: process.env.FAUCET_TABLE_NAME,
            FAUCET_SECRET_ID: process.env.FAUCET_SECRET_ID,
            FAUCET_RECOVERY_ADDRESS: process.env.FAUCET_RECOVERY_ADDRESS,
          };
          fs.writeFileSync('/tmp/lambda-environment-disabled.json', JSON.stringify({ Variables: { ...base, ...common, FAUCET_ENABLED: 'false' } }));
          fs.writeFileSync('/tmp/lambda-environment-enabled.json', JSON.stringify({ Variables: { ...base, ...common, FAUCET_ENABLED: 'true' } }));
          NODE
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_NAME" \
            --environment file:///tmp/lambda-environment-enabled.json \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$LAMBDA_NAME"
          for attempt in $(seq 1 15); do
            info_body="$(curl -fsS "$RPC_BASE_URL/v1/faucet/info")"
            if BODY="$info_body" node --input-type=module -e "const body=JSON.parse(process.env.BODY); process.exit(body.enabled === true ? 0 : 1)"; then
              break
            fi
            sleep 2
          done
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"$FAILED_ADDRESS\"}" \
            "$RPC_BASE_URL/v1/faucet/request")"
          status="$(printf '%s\n' "$response" | tail -n1)"
          body="$(printf '%s\n' "$response" | sed '$d')"
          printf '%s\n' "$body"
          echo "{\"recovery_http_status\":$status,\"failed_address\":\"$FAILED_ADDRESS\"}"
        env:
          RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com

      - name: Verify payout chain state
        if: steps.readiness.outputs.should_attempt == 'true'
        run: |
          set -euo pipefail
          curl -fsS "$RPC_BASE_URL/v1/transactions/$FAILED_TXID" | tee /tmp/recovery-tx-status.json || echo '{"status":"not_found"}' > /tmp/recovery-tx-status.json
          node ./scripts/analyze-faucet-public-state.mjs | tee /tmp/recovery-analysis-after-miner.json
        env:
          RPC_BASE_URL: https://ja6a03avlc.execute-api.ap-south-1.amazonaws.com
