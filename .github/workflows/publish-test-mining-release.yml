name: Publish Khushi Test Mining Release

on:
  push:
    branches:
      - feature/gpu-pow-v1
    paths:
      - '.github/workflows/publish-test-mining-release.yml'
      - 'docs/test-mining/PUBLIC_TEST_MINING.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: test-mining-v0.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest successful Windows miner builds
        id: runs
        shell: bash
        run: |
          set -euo pipefail
          cuda_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow khushi-windows-cuda.yml --branch feature/gpu-pow-v1 --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          opencl_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow khushi-windows-opencl.yml --branch feature/gpu-pow-v1 --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$cuda_run"
          test -n "$opencl_run"
          echo "cuda_run=$cuda_run" >> "$GITHUB_OUTPUT"
          echo "opencl_run=$opencl_run" >> "$GITHUB_OUTPUT"
          echo "NVIDIA CUDA run: $cuda_run"
          echo "OpenCL run: $opencl_run"

      - name: Download verified Windows miner artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nvidia dist/opencl
          gh run download "${{ steps.runs.outputs.cuda_run }}" --repo "$GITHUB_REPOSITORY" --name khushi-miner-nvidia-windows --dir dist/nvidia
          gh run download "${{ steps.runs.outputs.opencl_run }}" --repo "$GITHUB_REPOSITORY" --name khushi-miner-opencl-windows --dir dist/opencl
          test -f dist/nvidia/khushi-miner-nvidia.exe
          test -f dist/nvidia/SHA256SUMS.txt
          test -f dist/nvidia/build-metadata.txt
          test -f dist/nvidia/test-khushi-miner.ps1
          test -f dist/opencl/khushi-miner-opencl.exe
          test -f dist/opencl/khushi_pow.cl
          test -f dist/opencl/SHA256SUMS.txt
          test -f dist/opencl/build-metadata.txt
          test -f dist/opencl/test-khushi-miner.ps1

      - name: Package public release assets
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/nvidia && zip -9 -r ../khushi-miner-nvidia-windows.zip .)
          (cd dist/opencl && zip -9 -r ../khushi-miner-opencl-windows.zip .)
          sha256sum dist/khushi-miner-nvidia-windows.zip dist/khushi-miner-opencl-windows.zip | tee dist/RELEASE-SHA256SUMS.txt

      - name: Create or update public prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Sudharma Public Test Mining — Khushi Algorithm v0.1" \
              --notes-file docs/test-mining/PUBLIC_TEST_MINING.md \
              --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sudharma Public Test Mining — Khushi Algorithm v0.1" \
              --notes-file docs/test-mining/PUBLIC_TEST_MINING.md \
              --prerelease
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            dist/khushi-miner-nvidia-windows.zip \
            dist/khushi-miner-opencl-windows.zip \
            dist/RELEASE-SHA256SUMS.txt \
            --clobber

      - name: Show public release URL
        shell: bash
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
