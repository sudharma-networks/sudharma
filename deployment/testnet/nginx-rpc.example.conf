limit_req_zone $binary_remote_addr zone=sudharma_rpc:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name rpc.REPLACE_WITH_REAL_DOMAIN;

    # TLS certificate directives are intentionally provisioner-specific.
    # Example with Certbot:
    # ssl_certificate /etc/letsencrypt/live/rpc.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rpc.example/privkey.pem;

    client_max_body_size 1m;

    location / {
        limit_req zone=sudharma_rpc burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:28545;
    }
}
