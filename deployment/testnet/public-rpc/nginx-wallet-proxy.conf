server {
    listen 29100;
    server_name _;

    access_log /var/log/nginx/sudharma-wallet-proxy-access.log;
    error_log /var/log/nginx/sudharma-wallet-proxy-error.log warn;

    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:28545;
    }

    location = /ready {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:28545;
    }

    location = /v1/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:28545;
    }

    location ~ ^/v1/accounts/[0-9a-f]{40}$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:28545;
    }

    location = /v1/transactions {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:28545;
    }

    location ~ ^/v1/transactions/[0-9a-f]{64}$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:28545;
    }

    location / {
        return 404;
    }
}
