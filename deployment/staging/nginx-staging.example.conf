limit_req_zone $binary_remote_addr zone=sudharma_gpupow_staging:10m rate=2r/s;

server {
    listen 443 ssl http2;
    server_name mining-staging.REPLACE_WITH_REAL_DOMAIN;

    # TLS certificate directives are intentionally provisioner-specific.
    # Keep the verifier bound to localhost; only this proxy is public.
    # ssl_certificate /etc/letsencrypt/live/mining-staging.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mining-staging.example/privkey.pem;

    client_max_body_size 64k;

    location = /v1/mining/staging/challenge {
        limit_except GET { deny all; }
        limit_req zone=sudharma_gpupow_staging burst=4 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:28646;
    }

    location = /v1/mining/staging/submit {
        limit_except POST { deny all; }
        limit_req zone=sudharma_gpupow_staging burst=4 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:28646;
    }

    location / {
        return 404;
    }
}
